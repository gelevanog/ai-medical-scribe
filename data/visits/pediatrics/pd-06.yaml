dialogue:
  - speaker: clinician
    text: Hi, I'm Dr. Al-Sayed, nice to meet you. You're new with us, right? Can you tell me your full name and date of birth?
  - speaker: patient
    text: Yeah, Kenji Watanabe. March 9th, 2011.
  - speaker: clinician
    text: Thanks, Kenji. Is a parent with you today?
  - speaker: patient
    text: My mom, Yumi, she's out in the car on a work call. She said I'm 15, I can handle it.
  - speaker: clinician
    text: Fair enough. So what happened to the ankle?
  - speaker: patient
    text: I rolled it at basketball on Sunday. Wait, no, Saturday, it was Saturday morning practice. I went up for a rebound and came down on another guy's foot, and it kind of turned in.
  - speaker: clinician
    text: Ouch. Which ankle?
  - speaker: patient
    text: Right one. It swelled up right away. I limped off, but I could walk.
  - speaker: clinician
    text: Did you hear a pop or a snap?
  - speaker: patient
    text: No, I don't think so.
  - speaker: clinician
    text: How bad is the pain now, 0 to 10?
  - speaker: patient
    text: Like a 6 when I walk on it. Maybe a 2 when I'm just sitting.
  - speaker: clinician
    text: Any numbness or tingling in your foot?
  - speaker: patient
    text: Nope.
  - speaker: clinician
    text: Any pain in your knee or higher up the leg?
  - speaker: patient
    text: No, just the ankle.
  - speaker: clinician
    text: What have you done for it so far?
  - speaker: patient
    text: Ice, and I took 2 of the 200 milligram ibuprofen, so 400, twice a day. That helps some.
  - speaker: clinician
    text: Good. Have you hurt this ankle before?
  - speaker: patient
    text: Not this one. I sprained my left one in 8th grade, but it healed fine, no problems since.
  - speaker: clinician
    text: Any medicines you take every day, or any allergies?
  - speaker: patient
    text: Just cetirizine, 10 milligrams, in the spring for my allergies, I'm not on it right now. And I'm allergic to Bactrim, I got a rash all over from it.
  - speaker: clinician
    text: Got it, sulfa allergy with a rash. Okay, let's take a look. Your blood pressure is 118 over 72, pulse 70. On your right ankle there's swelling and some bruising on the outside, and you're tender right here, in front of the ankle bone on the outside.
  - speaker: patient
    text: Yeah, that's the spot.
  - speaker: clinician
    text: No tenderness on the back edge or tip of either ankle bone, and none at the base of your fifth toe bone or on top of the midfoot. When I pull your foot forward it's a little loose compared to the left, but there's a firm endpoint. Pulses and feeling in your foot are normal. Can you walk across the room for me?
  - speaker: patient
    text: Sure. It's limpy but okay.
  - speaker: clinician
    text: You took more than 4 steps on your own, good. So this is a sprain of the ligaments on the outside of your right ankle, probably grade 1 to 2. Based on the exam, you meet the rules where we don't need an X-ray.
  - speaker: patient
    text: Oh, nice. My friend Diego tore his ACL last month, so my mom kind of freaked out.
  - speaker: clinician
    text: Totally understandable, but your knee is fine. Here's the plan. Ice for 15 to 20 minutes every 2 to 3 hours for the next 2 days, keep it up on a pillow, and wear a compression wrap. We'll fit you with a lace-up ankle brace, and wear it for practice for the next couple of months.
  - speaker: patient
    text: Okay.
  - speaker: clinician
    text: Keep the ibuprofen at 400 milligrams, but every 8 hours with food, for 5 to 7 days, then just as needed. You can use crutches for 2 or 3 days if walking hurts, but put weight on it as much as you can. And start ankle alphabets, tracing the letters with your toes, a few times a day.
  - speaker: patient
    text: When can I play again? We've got a tournament in November.
  - speaker: clinician
    text: No basketball for about 2 weeks. You can go back once you can hop and run on it without pain. I'll write a note for Coach Brennan and for gym class at Westfield High School. If you can't put weight on it, or the pain moves onto the bone, call us and we'll get an X-ray. If it's not much better in 2 weeks, come back and we'll set up physical therapy.
  - speaker: patient
    text: Cool. Can you send the note to my portal? My email is kenji dot watanabe 11 at example dot com.
  - speaker: clinician
    text: Sure. And the phone number for you is 555-0192?
  - speaker: patient
    text: Yeah, that's my mom's cell.
  - speaker: clinician
    text: Perfect. Nice sneakers, by the way.
  - speaker: patient
    text: Thanks, they were a birthday present. Wrong ones to roll an ankle in, I guess.
