dialogue:
  - speaker: clinician
    text: Hi, come on in and have a seat. I'm Dr. Adaeze Okonkwo, one of the cardiologists here. Can you tell me your full name and date of birth?
  - speaker: patient
    text: Tomasz Wieczorek. August 3rd, 1964.
  - speaker: clinician
    text: Thank you, Mr. Wieczorek. Did you find parking okay? The garage is a mess this week with the construction.
  - speaker: patient
    text: Took me two laps, but yeah, I found a spot eventually.
  - speaker: clinician
    text: Sorry about that. So Dr. Patel sent you over about some chest discomfort. Tell me what's been going on.
  - speaker: patient
    text: So, about 6 weeks ago I started getting this pressure in the middle of my chest. Like somebody's sitting on me. It happens when I walk up the hill to my house, or when I carry groceries up the stairs.
  - speaker: clinician
    text: And how long does it last when it comes on?
  - speaker: patient
    text: A few minutes. If I stop and stand there, it goes away in maybe 3, 4 minutes.
  - speaker: clinician
    text: Does it ever happen when you're resting, or wake you up at night?
  - speaker: patient
    text: No, never at rest. Only when I'm pushing it.
  - speaker: clinician
    text: Does the pressure go anywhere, like your arm, your jaw, or your back?
  - speaker: patient
    text: Sometimes a little into my left arm. Not the jaw.
  - speaker: clinician
    text: Any shortness of breath with it?
  - speaker: patient
    text: A little winded, yeah. But I figured that's just me being out of shape.
  - speaker: clinician
    text: Any sweating, nausea, or lightheadedness with the episodes?
  - speaker: patient
    text: No sweating. No nausea. I've never passed out or anything like that.
  - speaker: clinician
    text: Has it been getting more frequent, or easier to bring on?
  - speaker: patient
    text: Um, not really. It's about the same, maybe 2 or 3 times a week.
  - speaker: clinician
    text: Okay. Dr. Patel's note says you have high blood pressure and high cholesterol. What are you taking for those?
  - speaker: patient
    text: Lisinopril, 20 milligrams in the morning. And he started me on atorvastatin, 40 milligrams at night, about a year ago.
  - speaker: clinician
    text: Any allergies to medications?
  - speaker: patient
    text: Penicillin. I got hives from it as a kid.
  - speaker: clinician
    text: Do you smoke?
  - speaker: patient
    text: I quit 10 years ago. Before that I smoked about a pack a day for 25 years.
  - speaker: clinician
    text: Good for you on quitting, that's a big deal. Any diabetes?
  - speaker: patient
    text: No, my sugar's always been fine.
  - speaker: clinician
    text: And what do you do for work?
  - speaker: patient
    text: I'm a dispatcher at Hollister Freight. Mostly sitting, honestly.
  - speaker: clinician
    text: Okay. Your blood pressure today is 142 over 86, pulse 74, and your oxygen is 98 percent. Weight is 214 pounds. Let me take a listen. Heart has a regular rhythm, no murmurs. Lungs are clear. No swelling in your legs, and the pulses in your feet are good.
  - speaker: patient
    text: That's good, I guess.
  - speaker: clinician
    text: We did an ECG when you came in. It shows normal sinus rhythm at 72, and I don't see any signs of an old heart attack or any acute changes. That's reassuring, but a resting ECG is often normal even when there's a blockage, because the problem only shows up when the heart is working hard.
  - speaker: patient
    text: So what does that mean, then?
  - speaker: clinician
    text: What you're describing, pressure with exertion that goes away with rest, is pretty classic for stable angina. That means the heart muscle isn't getting enough blood when it works harder, usually from narrowing in the heart arteries. With your smoking history, blood pressure and cholesterol, that's my main concern.
  - speaker: patient
    text: Okay. That's kind of scary.
  - speaker: clinician
    text: I understand. The good news is it's stable, and we have a clear plan. First, I'd like you to have a nuclear stress test, where you walk on a treadmill while we take pictures of the blood flow to your heart. We'll also check a fasting lipid panel and a basic metabolic panel.
  - speaker: patient
    text: Sure, that's fine.
  - speaker: clinician
    text: In the meantime, I want you to start aspirin, 81 milligrams once a day. I'm also starting metoprolol succinate, 25 milligrams once a day, which slows the heart down so it doesn't work as hard. And I'm giving you nitroglycerin, 0.4 milligrams, one tablet under the tongue if the pressure comes on and doesn't go away with rest. You can repeat it every 5 minutes, up to 3 tablets.
  - speaker: patient
    text: Got it.
  - speaker: clinician
    text: I'm also going to increase your atorvastatin from 40 to 80 milligrams at night. Keep the lisinopril the same.
  - speaker: patient
    text: Okay.
  - speaker: clinician
    text: Now, this part is important. If you get chest pain at rest, or pain that lasts more than 15 minutes, or it doesn't go away after one nitroglycerin, call 911. Don't drive yourself.
  - speaker: patient
    text: Understood.
  - speaker: clinician
    text: And hold off on heavy lifting and that hill until we have the stress test results. What's the best number to reach you for scheduling?
  - speaker: patient
    text: My cell, 555-0163.
  - speaker: clinician
    text: Great. We'll get the stress test done within the next 2 weeks, and I'll see you back right after to go over the results.
  - speaker: patient
    text: Thanks, doctor. I appreciate it.
