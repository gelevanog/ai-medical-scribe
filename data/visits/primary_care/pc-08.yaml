dialogue:
  - speaker: clinician
    text: Good morning, Mrs. Turner. Can you tell me your full name and your birthday?
  - speaker: patient
    text: Odessa Turner. April 19th, 1935. I'm 91 years old, and I still remember it, so don't you worry.
  - speaker: clinician
    text: Sharp as ever. Did Gloria bring you today?
  - speaker: patient
    text: She did, she's out in the waiting room on her phone. She's the one who made me come.
  - speaker: clinician
    text: Well, I'm glad she did. What's been going on?
  - speaker: patient
    text: I'm just worn out, doctor. For about six weeks now. I nap in the morning and again after lunch, and I used to never nap. My tomatoes are going to waste because I can't get out to the garden.
  - speaker: clinician
    text: That's a big change for you. Any dizziness?
  - speaker: patient
    text: When I first get up out of bed in the morning, the room kind of swims for a second. Then it passes.
  - speaker: clinician
    text: Have you fallen at all?
  - speaker: patient
    text: No, I hold on to the dresser.
  - speaker: clinician
    text: Any chest pain or shortness of breath?
  - speaker: patient
    text: No chest pain. I breathe fine.
  - speaker: clinician
    text: Fever, black stools, or losing weight without trying?
  - speaker: patient
    text: No, none of that.
  - speaker: clinician
    text: Have you been feeling down or sad?
  - speaker: patient
    text: No, I'm not sad. Just tired.
  - speaker: clinician
    text: Let's go through your pills. I have amlodipine 5 milligrams once a day for your blood pressure, metoprolol 50 milligrams twice a day, atorvastatin 10 at night, and a baby aspirin, 81 milligrams. Anything else?
  - speaker: patient
    text: That's right. And I take a Tylenol PM at bedtime, because I wasn't sleeping. Gloria bought me a big bottle about two months ago.
  - speaker: clinician
    text: Every night?
  - speaker: patient
    text: Every night. Oh, and I quit the vitamin D. Those pills are too big to swallow.
  - speaker: clinician
    text: Okay, that's helpful. Any other new problems this year?
  - speaker: patient
    text: Well, I had pneumonia last winter, but I got over that. Lungs have been fine since.
  - speaker: clinician
    text: Good. Let me check you. Sitting, your blood pressure is 118 over 64, and your pulse is 52, which is on the slow side. Standing up, the pressure drops to 104 over 60.
  - speaker: clinician
    text: Your heart is slow but regular, no murmur. Lungs are clear. No swelling in your ankles. Your color looks good, no paleness inside the eyelids.
  - speaker: clinician
    text: We also did an ECG while you were waiting. It shows a slow, regular rhythm, a rate of 52, and no heart block.
  - speaker: patient
    text: So what's making me so tired?
  - speaker: clinician
    text: I think a big part is your medicines. Your pulse is slow, and the metoprolol may be slowing it too much. And the Tylenol PM has diphenhydramine in it, which is a sleepy antihistamine. At 91, it can make you drowsy all day.
  - speaker: patient
    text: My goodness. I thought it was just the Tylenol.
  - speaker: clinician
    text: A lot of people think that. So, here's the plan. Stop the Tylenol PM. If you have aches at night, plain Tylenol, that's acetaminophen, 500 milligrams is fine. Cut the metoprolol down to 25 milligrams twice a day, that's half a tablet. Keep the amlodipine, atorvastatin and aspirin the same.
  - speaker: patient
    text: What about sleeping, then?
  - speaker: clinician
    text: Same bedtime every night, no long afternoon naps, and some light in the morning. That helps more than you'd think. For the vitamin D, I'll switch you to a chewable, 1000 units a day.
  - speaker: patient
    text: A chewable I can do.
  - speaker: clinician
    text: I also want some blood work today, a blood count, chemistry panel, thyroid test and B12, to make sure we're not missing anything else.
  - speaker: patient
    text: All right.
  - speaker: clinician
    text: Get up slowly, sit on the edge of the bed for a minute first. If you faint, have chest pain, or your pulse gets slower, call us or go to the emergency room. I'll see you in 2 weeks, and we'll call Gloria at 555-0177 with the results.
  - speaker: patient
    text: That's her number. Thank you, doctor. I'll bring you some tomatoes if I get my energy back.
  - speaker: clinician
    text: I'll hold you to that, Mrs. Turner.
