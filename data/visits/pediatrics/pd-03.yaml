dialogue:
  - speaker: clinician
    text: Hi, welcome back! Wow, someone got tall. Can you confirm her full name and date of birth for me, Mom?
  - speaker: caregiver
    text: Ananya Iyer, September 28th, 2022. She just turned 4, so she's very proud.
  - speaker: clinician
    text: Happy birthday, Ananya! So this is her 4-year checkup. Lakshmi, any concerns before we get into the usual stuff?
  - speaker: caregiver
    text: Just one, really. Her poop. She's been going only every 3 or 4 days for maybe 2 months, and it's hard, and she cries when she goes. Sometimes she hides behind the couch and holds it.
  - speaker: clinician
    text: That's really common at this age. Any blood in the stool or on the toilet paper?
  - speaker: caregiver
    text: No, I haven't seen any.
  - speaker: clinician
    text: Any accidents during the day, or belly pain between poops?
  - speaker: caregiver
    text: No accidents. She'll say her tummy hurts right before she goes, but otherwise she's fine.
  - speaker: clinician
    text: How much milk is she drinking?
  - speaker: caregiver
    text: Oh, a lot. Probably 3 or 4 cups a day. She's a picky eater, so milk and crackers and pasta, honestly. Fruit sometimes.
  - speaker: clinician
    text: Okay, that's a big part of the picture. Is she taking any medicines or vitamins?
  - speaker: caregiver
    text: Just a kids' multivitamin gummy, 1 a day. No medicines. And no allergies.
  - speaker: clinician
    text: Great. How's preschool going?
  - speaker: caregiver
    text: She loves it. She's at Sunflower Montessori, 4 mornings a week. The teachers say she plays well with the other kids.
  - speaker: clinician
    text: Love that. Is she talking in full sentences, can strangers understand her?
  - speaker: caregiver
    text: Oh yes, she never stops talking. She can hop on one foot, she draws people with arms and legs, she dresses herself, mostly. Daytime potty trained since 3.
  - speaker: clinician
    text: Those are all right on track. How's sleep, does she snore?
  - speaker: caregiver
    text: No snoring. She sleeps about 10 or 11 hours.
  - speaker: clinician
    text: And she's seeing a dentist?
  - speaker: caregiver
    text: Yes, last month, no cavities. We brush twice a day.
  - speaker: clinician
    text: Perfect. Still in a car seat with a harness?
  - speaker: caregiver
    text: Yes, forward-facing, 5-point harness.
  - speaker: clinician
    text: Good. Okay, her numbers. Weight is 17 kilograms, about 37 and a half pounds, height is 103 centimeters, and her BMI is around the 65th percentile, so she's growing nicely. Blood pressure is 94 over 56. On the vision screen she read the 20 over 30 line with each eye, which is a pass for 4. And she passed the hearing screen in both ears.
  - speaker: caregiver
    text: Oh, good. I was a little worried about her eyes, because my husband had a lazy eye as a kid and had to wear a patch.
  - speaker: clinician
    text: That's good to know, and that's exactly why we screen. Her eyes line up well and the screen is normal. Let me examine her. Heart sounds normal, no murmur. Lungs are clear. Her belly is soft and not tender, but I can feel some stool on the lower left side. Her bottom looks normal, no tears or fissures. Teeth look great.
  - speaker: caregiver
    text: Okay.
  - speaker: clinician
    text: So overall, a healthy 4-year-old, growing and developing normally. The one issue is constipation. With the hard stools and the holding, I'd like to start MiraLAX. The usual dose is about half a gram per kilogram, so at 17 kilograms, that's about 8 and a half grams, which is half a capful, mixed in 4 ounces of water or juice once a day.
  - speaker: caregiver
    text: Half a capful once a day. Okay.
  - speaker: clinician
    text: You can adjust it. The goal is a soft poop every day or every other day. Also, cut the milk down to 2 cups a day, 16 ounces, add fruit and water, and have her sit on the potty for 5 minutes after meals. If it isn't better in a month, or you see blood, send me a message and we'll go from there.
  - speaker: caregiver
    text: That makes sense. And shots today?
  - speaker: clinician
    text: Yes, 2 shots. One is DTaP and polio combined, the other is MMR and chickenpox combined. She might get a sore leg or a low fever, and with the MMR part, a rash or fever 1 to 2 weeks later is possible. If she's uncomfortable, children's Tylenol, about 8 milliliters for her weight. Has she had her flu shot this year?
  - speaker: caregiver
    text: Yes, we got it at the pharmacy on October 2nd, when I got mine.
  - speaker: clinician
    text: Perfect, I'll record that. Any questions about the shots?
  - speaker: caregiver
    text: No, we're good. She had a cough back in September, but that's totally gone, so she's okay to get them, right?
  - speaker: clinician
    text: Yes, totally fine. So, shots with the nurse, the MiraLAX, and I'll see her at 5 for her next checkup. What's she going to be for Halloween?
  - speaker: caregiver
    text: A purple dinosaur. She's insisting.
  - speaker: clinician
    text: Of course she is. Bye, Ananya!
