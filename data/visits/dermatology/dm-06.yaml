  clinician: {sex: female}
  patient: {sex: male}
dialogue:
  - speaker: clinician
    text: "Morning, Mr. Petrescu. How's the harvest going?"
  - speaker: patient
    text: "Slow. Soybeans are in, corn's still standing. Too wet last week."
  - speaker: clinician
    text: "Well, I hope it dries out for you. Can you tell me your full name and date of birth, just to confirm?"
  - speaker: patient
    text: "Bogdan Petrescu. March 11th, 1952."
  - speaker: clinician
    text: "Thank you. And the front desk said you moved?"
  - speaker: patient
    text: "Yep, we sold the old place. New address is 8817 County Road 12, Seward, Nebraska. Phone's the same, 555-0156."
  - speaker: clinician
    text: "Got it, I'll make sure that's updated. So what's bothering you today?"
  - speaker: patient
    text: "These rough spots on top of my head. My wife Elena says they look like sandpaper. They catch on the comb and bleed a little when I scratch them. Been a few months."
  - speaker: clinician
    text: "Do any of them hurt?"
  - speaker: patient
    text: "No, they don't hurt."
  - speaker: clinician
    text: "Any spot that's growing fast or bleeding on its own?"
  - speaker: patient
    text: "No, nothing like that."
  - speaker: clinician
    text: "Do you wear a hat out in the field?"
  - speaker: patient
    text: "A seed cap, the kind with the mesh in the back. Sunscreen, no, I never bother with it."
  - speaker: clinician
    text: "Okay. Any changes in your medicines?"
  - speaker: patient
    text: "Same as always. Atorvastatin 20 milligrams at night and a baby aspirin, the 81, every morning. No allergies."
  - speaker: clinician
    text: "Good. Oh, and how's the spot on your left cheek where we took off the basal cell back in 2021?"
  - speaker: patient
    text: "Fine, I don't even think about it. My neighbor Roy just had a melanoma taken off his ear, though. Scared him half to death."
  - speaker: clinician
    text: "I bet. Let's have a look. Your scalp has a lot of background sun damage. I count 6 rough, gritty, pink scaly spots, 3 to 8 millimeters, on the top and front of the scalp. None of them are thick, tender, or growing like a bump, so nothing that worries me for a skin cancer today. The scar on your left cheek is well healed and I don't see anything coming back there."
  - speaker: patient
    text: "That's good."
  - speaker: clinician
    text: "Can you lift your shirt so I can check your back? Okay. You have several brown, waxy, stuck-on spots on your back, about 1 centimeter each. Those are seborrheic keratoses. They're harmless, no treatment needed."
  - speaker: patient
    text: "My barnacles, Elena calls them."
  - speaker: clinician
    text: "Ha, that's exactly what they look like. So the spots on your scalp are actinic keratoses. They're precancers from years of sun. Most never turn into cancer, but some can become a squamous cell skin cancer, so I'd like to freeze all 6 today with liquid nitrogen. Okay?"
  - speaker: patient
    text: "Go ahead."
  - speaker: clinician
    text: "Alright, it'll sting for a bit. First one. Second. Third, fourth, fifth, and six. That's all 6 done."
  - speaker: patient
    text: "Huh. That wasn't bad."
  - speaker: clinician
    text: "Over the next few days they'll get red, maybe blister, then crust and peel off in 1 to 3 weeks. You can put a little petroleum jelly on them. If any spot hasn't healed in 6 weeks, or starts growing, come back and we'll biopsy it."
  - speaker: patient
    text: "Okay."
  - speaker: clinician
    text: "Now the big one, the sun. Every morning, a broad-spectrum sunscreen, SPF 30 or higher, on your scalp, face, ears, and the backs of your hands. Reapply every 2 hours when you're out in the field. And trade the seed cap for a wide-brimmed hat that covers your ears and neck. Long sleeves help too."
  - speaker: patient
    text: "Elena's going to love that, she's been on me about a hat for years."
  - speaker: clinician
    text: "She's right. If a lot more of these come back, there's a cream called fluorouracil we can use to treat the whole scalp at once, but let's see how you do. I'd like to see you in 6 months for a full skin check, since you've had a skin cancer before."
  - speaker: patient
    text: "Six months. I'll put it on the calendar after harvest."
  - speaker: clinician
    text: "Sounds good. Take care of yourself, Mr. Petrescu."
