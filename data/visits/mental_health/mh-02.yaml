dialogue:
  - speaker: clinician
    text: Good afternoon, Tomasz. Just to confirm, full name and date of birth?
  - speaker: patient
    text: Tomasz Nowak, November 30th, 1985.
  - speaker: clinician
    text: Perfect. It's been about three months since we started the escitalopram. How are things?
  - speaker: patient
    text: Better, I'd say. Maybe halfway better. I'm not lying awake every night anymore, but the worrying is still there most days.
  - speaker: clinician
    text: What does the worrying look like these days?
  - speaker: patient
    text: Mostly work. I'm a loan officer at Lakeshore Credit Union and there's a reorganization going on. And my wife Kasia is due in November, so, you know, there's a lot on my mind. My shoulders are tight all the time and I snap at people more than I want to.
  - speaker: clinician
    text: Congratulations on the baby. And how's falling asleep?
  - speaker: patient
    text: Still takes me maybe 45 minutes most nights. My brain just won't shut off.
  - speaker: clinician
    text: You were having panic attacks back in the spring. Any since we last met?
  - speaker: patient
    text: No, none since April. That part's actually gone.
  - speaker: clinician
    text: That's great. Remind me what dose of escitalopram you're on.
  - speaker: patient
    text: The 5 milligrams. Oh, no, wait, sorry. I went up to 10 after the first two weeks, like you said. So 10 every morning.
  - speaker: clinician
    text: Okay, 10 milligrams. Any side effects, nausea, sexual side effects, anything like that?
  - speaker: patient
    text: No, nothing really. Stomach was a bit off the first week, then fine.
  - speaker: clinician
    text: And the hydroxyzine, the 25 milligrams for bad moments, how often are you using it?
  - speaker: patient
    text: Maybe twice in the last month. It works but it knocks me out.
  - speaker: clinician
    text: Anything else you're taking, over the counter or supplements?
  - speaker: patient
    text: Magnesium glycinate, 200 milligrams at night. A friend recommended it.
  - speaker: clinician
    text: That's fine to keep. How much coffee are you drinking?
  - speaker: patient
    text: Uh, honestly, four cups a day. Maybe five on bad days.
  - speaker: clinician
    text: That might be feeding the jitters a bit. Any alcohol?
  - speaker: patient
    text: A beer on the weekend, that's it.
  - speaker: clinician
    text: I have to ask this every time. Any thoughts of suicide or of harming yourself?
  - speaker: patient
    text: No. None.
  - speaker: clinician
    text: Good. So your GAD-7 today is 12. When you started it was 16, so it's moving in the right direction, but it's still in the moderate range. Your blood pressure is 128 over 82 and your pulse is 84. You look a little tense but you're talkative, your mood is anxious, your thinking is clear.
  - speaker: patient
    text: Yeah. Tense is a good word for it.
  - speaker: clinician
    text: So I think this is generalized anxiety disorder that's partly responding. You're tolerating the escitalopram well, so I'd like to increase it to 20 milligrams once a day. Take two of your 10s until the new prescription is filled.
  - speaker: patient
    text: Okay, that's easy.
  - speaker: clinician
    text: Keep the hydroxyzine for the rough moments, up to once a day, and don't drive after you take it. Keep the magnesium. And I'd like you to cut the coffee to 2 cups a day, nothing after noon.
  - speaker: patient
    text: That one's going to hurt, but okay.
  - speaker: clinician
    text: Are you still seeing the therapist for CBT?
  - speaker: patient
    text: Every other week, yeah.
  - speaker: clinician
    text: Good, keep that going. And as always, if you ever have thoughts of hurting yourself, call or text 988 right away. I'd like to see you back in 6 weeks, so that's around November 4th, before the baby comes.
  - speaker: patient
    text: Sounds good. Can you send the summary to my portal? My email changed, it's tomasz dot nowak at fastmail dot com.
  - speaker: clinician
    text: I'll update it. Take care, and good luck with the reorganization.
