name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_LINK_MODE: copy
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: mypy (strict)
        run: uv run mypy

      - name: Tests (no API keys, no model downloads)
        run: uv run pytest -m "not speech" --junitxml=report.xml

      - name: Offline smoke run (fake model, offline ICD-10-CM subset)
        env:
          NOTEWELL_LLM_PROVIDER: fake
          NOTEWELL_LLM_LEDGER: ""
          NOTEWELL_DATA_DIR: /tmp/notewell
          NOTEWELL_RESULTS_DIR: /tmp/results
        run: |
          uv run notewell data validate
          uv run notewell draft pc-01
          uv run notewell mask cd-03 | head -20
          uv run notewell codes validate I10 E11 E11.9
          uv run notewell eval notes offline --provider fake --ids pc-01,cd-01,dm-01,pd-01,mh-01
          uv run notewell eval canary --provider fake --ids pc-01,cd-01,dm-01,pd-01,mh-01

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: report.xml

  frontend:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: notewell-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image (no push)
        uses: docker/build-push-action@v7
        with:
          context: web
          push: false
          tags: notewell-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
