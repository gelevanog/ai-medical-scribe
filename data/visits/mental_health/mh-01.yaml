dialogue:
  - speaker: clinician
    text: Hi, come on in, have a seat anywhere. I'm Priya Natarajan, one of the psychiatric nurse practitioners here. Can you tell me your full name and date of birth?
  - speaker: patient
    text: Daniela Restrepo. May 8th, 1992.
  - speaker: clinician
    text: Thank you, Daniela. Did you find parking okay? That garage is a bit of a maze.
  - speaker: patient
    text: Yeah, I ended up all the way on the roof, but it's fine.
  - speaker: clinician
    text: That happens to everyone. So your primary care doctor sent you over. Tell me in your own words what's been going on.
  - speaker: patient
    text: Um, I've just been really down. For about three months now. I don't enjoy anything anymore. I used to paint on the weekends and I haven't touched it since June.
  - speaker: clinician
    text: I'm sorry, that sounds really hard. How's your sleep been?
  - speaker: patient
    text: Bad. I fall asleep okay, but I wake up around 4 in the morning and I can't get back to sleep.
  - speaker: clinician
    text: And your appetite?
  - speaker: patient
    text: I'm just not hungry. I think I've lost maybe 8 pounds without trying.
  - speaker: clinician
    text: What about energy and concentration?
  - speaker: patient
    text: Low energy, all the time. At work I read the same email like three times. I'm a project coordinator at Halvorsen Engineering and I'm, you know, kind of barely keeping up.
  - speaker: clinician
    text: Did anything happen that set this off?
  - speaker: patient
    text: My relationship ended in the spring. Five years. But honestly, it feels bigger than that now.
  - speaker: clinician
    text: That makes sense. Have you ever had a stretch like this before, or been treated for depression or anxiety?
  - speaker: patient
    text: No, this is the first time. I've never been on anything for it.
  - speaker: clinician
    text: Have you ever had times where you felt the opposite, like really high energy, barely needing sleep for days, racing thoughts?
  - speaker: patient
    text: No, never.
  - speaker: clinician
    text: Anyone in your family with depression or bipolar disorder?
  - speaker: patient
    text: My aunt on my dad's side has bipolar, I think. And my sister Paola takes something for anxiety, I don't know what.
  - speaker: clinician
    text: Okay, that's helpful. Now I'm going to ask a couple of questions I ask everyone. Have you had any thoughts that you'd be better off dead, or thoughts of hurting yourself?
  - speaker: patient
    text: No. I feel awful, but no, nothing like that.
  - speaker: clinician
    text: Any thoughts of hurting anyone else?
  - speaker: patient
    text: No.
  - speaker: clinician
    text: Thank you for answering that. How about alcohol or drugs?
  - speaker: patient
    text: Maybe a glass of wine once a week. No drugs.
  - speaker: clinician
    text: Any medical problems, and are you allergic to any medications?
  - speaker: patient
    text: I'm healthy otherwise. I'm allergic to penicillin, I break out in hives.
  - speaker: clinician
    text: Got it. So the questionnaire you filled out in the waiting room, the PHQ-9, your score is 15, which is in the moderate range. Your GAD-7 anxiety score is 6, so mild. Your blood pressure today is 116 over 74, pulse 72, and your weight is 138 pounds. And so you know what I'm noting, you're well groomed, your speech is normal, your mood is sad and your affect is a bit flat, and your thinking is clear and organized.
  - speaker: patient
    text: Yeah, that sounds about right.
  - speaker: clinician
    text: So here's what I think. This looks like major depression, a single episode, moderate. The good news is it's very treatable. What I'd like to do is start sertraline, 25 milligrams once a day for one week, then go up to 50 milligrams once a day. It can take 4 to 6 weeks to really feel the difference.
  - speaker: patient
    text: Are there side effects?
  - speaker: clinician
    text: Some people get an upset stomach or a headache the first week or two, and that usually fades. Take it with breakfast. And because of your aunt's history, if you ever notice you're suddenly wired, not sleeping but not tired, call us right away.
  - speaker: patient
    text: Okay.
  - speaker: clinician
    text: I'd also like you to start therapy, so I'm putting in a referral to our therapy team for weekly sessions. And I'm giving you this safety plan card. If you ever do have thoughts of hurting yourself, you can call or text 988, the crisis line, any time, or go to the nearest emergency room.
  - speaker: patient
    text: Okay. Thank you.
  - speaker: clinician
    text: Which pharmacy do you use?
  - speaker: patient
    text: Lakeview Pharmacy, on 4120 Belmont Avenue.
  - speaker: clinician
    text: I'll send it there. And what's the best number to reach you?
  - speaker: patient
    text: 773-555-0164.
  - speaker: clinician
    text: Great. Let's see you back in 4 weeks, on October 19th, to check how you're doing on the medicine.
  - speaker: patient
    text: Sounds good. Thanks, really.
