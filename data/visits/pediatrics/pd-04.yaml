dialogue:
  - speaker: clinician
    text: Hi, come on in, have a seat right there. I can hear him from here, buddy. Can I get his full name and date of birth?
  - speaker: caregiver
    text: Jaylen Brooks, May 21st, 2016. I'm his grandmother, Loretta. I have guardianship.
  - speaker: clinician
    text: Thanks, Loretta. What's been going on?
  - speaker: caregiver
    text: He caught a cold about 3 days ago, runny nose, and then yesterday the wheezing started and the cough got real bad. He woke up twice last night coughing.
  - speaker: clinician
    text: How often has he needed his albuterol?
  - speaker: caregiver
    text: Every 4 hours since last night. 2 puffs each time. Well, no, he's been doing 4 puffs, the school nurse told him 4. Last time was around 7 this morning.
  - speaker: clinician
    text: And does it help?
  - speaker: caregiver
    text: For an hour or two, then he's back to wheezing.
  - speaker: clinician
    text: Okay. And the daily inhaler, the fluticasone, is he still taking that?
  - speaker: caregiver
    text: Um, honestly, no. He was doing so good over the summer that we kind of stopped it. Maybe since June.
  - speaker: clinician
    text: That happens a lot, no judgment. Any fever?
  - speaker: caregiver
    text: No, I've been checking, no fever.
  - speaker: clinician
    text: Jaylen, does your chest hurt?
  - speaker: caregiver
    text: He's shaking his head. He says it just feels tight.
  - speaker: clinician
    text: Any vomiting after coughing fits?
  - speaker: caregiver
    text: No.
  - speaker: clinician
    text: Anybody smoke around him, at home or in the car?
  - speaker: caregiver
    text: No, nobody smokes. I've got COPD myself, I'm on oxygen at night, so believe me, there's no smoking in my house.
  - speaker: clinician
    text: Good. Has he needed steroids or been in the hospital for his asthma this year?
  - speaker: caregiver
    text: Not this year. He had pneumonia 2 winters ago, but that cleared up, and he's never been admitted for asthma.
  - speaker: clinician
    text: Any allergies to medicines?
  - speaker: caregiver
    text: None.
  - speaker: clinician
    text: Okay. So his weight today is 30 kilograms. Temperature 99.1, heart rate 118, he's breathing 28 times a minute, and his oxygen level is 93 percent on room air. Let me listen. I hear wheezing all over both lungs when he breathes out, and there's a little pulling in under his ribs. He's still talking in full sentences, which is reassuring. Ears and throat look okay.
  - speaker: caregiver
    text: Is that bad, the 93?
  - speaker: clinician
    text: It's a bit low, so I want to give him a breathing treatment right now, albuterol with ipratropium in the nebulizer, and we'll recheck in about 20 minutes.
  - speaker: caregiver
    text: Okay. Go on, baby, hold the mask.
  - speaker: clinician
    text: Alright, it's been about 20 minutes. Oxygen is up to 97 percent, breathing rate 22, heart rate 130, which is from the albuterol, that's expected. Just a few scattered wheezes now and no more pulling under the ribs. That's a nice response.
  - speaker: caregiver
    text: He looks better. His color's better.
  - speaker: clinician
    text: Agreed. So this is an asthma flare, triggered by the cold, and made worse because he's been off his controller. First, a steroid by mouth. The dose is 1 milligram per kilogram, he's 30 kilograms, so prednisolone 30 milligrams once a day for 5 days. The liquid is 15 milligrams per 5 milliliters, so that's 10 milliliters each morning. I'll give the first dose here.
  - speaker: caregiver
    text: 10 milliliters, 5 days.
  - speaker: clinician
    text: Right. Second, albuterol, 4 puffs with the spacer every 4 hours while he's awake for the next 2 days, then just as needed. Third, restart the fluticasone, the 44 micrograms, 2 puffs twice a day, and have him rinse his mouth after. That one he needs every day, even when he feels fine.
  - speaker: caregiver
    text: Okay. I'll put it next to his toothbrush.
  - speaker: clinician
    text: Great idea. I'm updating his asthma action plan, and I'll print one for the nurse at Garfield Elementary. He can go back to school when he's not needing albuterol more than every 4 hours.
  - speaker: caregiver
    text: Okay. Can you check his insurance is still the same? The member ID is M as in Mary 6 6 2 0 4 1 8.
  - speaker: clinician
    text: Got it, that matches. If he needs albuterol more often than every 4 hours, can't speak in full sentences, his ribs are pulling in, or his lips look blue, go to the emergency room. I want to see him back on Friday to recheck, and we'll do his flu shot then.
  - speaker: caregiver
    text: Friday. And the number is still 555-0129.
  - speaker: clinician
    text: Perfect. Hang in there, Jaylen.
