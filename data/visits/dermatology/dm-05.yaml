dialogue:
  - speaker: clinician
    text: "Hi Oksana, come on in. Before anything else, can you give me your full name and date of birth?"
  - speaker: patient
    text: "Oksana Kovalenko, August 30th, 1979."
  - speaker: clinician
    text: "Thank you. How's the psoriasis been?"
  - speaker: patient
    text: "Honestly, worse. Over the last 4 months it's spread. My elbows and knees are bad again, there's a big patch on my lower back, and my scalp itches like crazy. I've had this for 8 years and this is the worst it's been."
  - speaker: clinician
    text: "I'm sorry. Are you still using the clobetasol ointment?"
  - speaker: patient
    text: "Yes, twice a day on the worst spots. It helps for a few days and then it all comes back."
  - speaker: clinician
    text: "And the methotrexate from last spring?"
  - speaker: patient
    text: "I stopped that on my own in June. I was on 10 milligrams a week. No, wait, it was 15, 6 of the little 2.5 pills. It made me so nauseous and my hair got thin."
  - speaker: clinician
    text: "Okay, that's helpful, thank you for telling me. Let me ask about your joints. Any joint pain or swelling?"
  - speaker: patient
    text: "No."
  - speaker: clinician
    text: "Stiffness in the morning? Sausage-like swelling of a finger or toe? Heel pain?"
  - speaker: patient
    text: "No, none of that. My mom had rheumatoid arthritis in her hands, so I'd notice, believe me."
  - speaker: clinician
    text: "Good. Other medicines?"
  - speaker: patient
    text: "Amlodipine, 5 milligrams every morning for blood pressure. That's it."
  - speaker: clinician
    text: "And you're allergic to sulfa, right?"
  - speaker: patient
    text: "Yes, I get a rash all over."
  - speaker: clinician
    text: "Still not smoking?"
  - speaker: patient
    text: "3 years quit now."
  - speaker: clinician
    text: "That's great. Okay, let me look. On both elbows there are well-defined red plaques with thick silvery scale, the right one is about 8 by 6 centimeters. Similar plaques on both knees. On the lower back there's a 10 by 7 centimeter plaque. On the scalp, red scaly plaques behind both ears and along the hairline. I see pitting on 3 of your fingernails. Your finger joints aren't swollen or tender, and no swollen fingers or toes. Overall about 12 percent of your body surface."
  - speaker: patient
    text: "Twelve percent. That sounds like a lot."
  - speaker: clinician
    text: "It is. So this is moderate to severe plaque psoriasis that isn't controlled with creams, and methotrexate didn't work out for you. I think you're a really good candidate for a biologic. The one I'd recommend is risankizumab. It's an injection under the skin, 150 milligrams, given at week 0, week 4, and then just every 12 weeks."
  - speaker: patient
    text: "Every 12 weeks? That's not bad. What are the risks?"
  - speaker: clinician
    text: "It calms down part of the immune system, so there's a slightly higher chance of infections like colds. Serious problems are rare. Before we start, I need a TB blood test, hepatitis B and C tests, a blood count and a metabolic panel. You should also avoid live vaccines once you're on it, so getting your flu shot this fall is a good idea."
  - speaker: patient
    text: "Okay. Can I do the blood work at the lab by my house? It's at 2250 Riverside Drive."
  - speaker: clinician
    text: "Absolutely, I'll send the orders there. We'll also need a prior authorization from your insurance. Do you have your card?"
  - speaker: patient
    text: "Yeah, member ID is K as in kilo 7 0 3 9 2 1 5."
  - speaker: clinician
    text: "Got it. In the meantime, keep the clobetasol ointment twice a day on the body plaques, but only 2 weeks at a time, then a week off, so the skin doesn't thin. For your scalp, I'm adding clobetasol 0.05 percent solution, once a day at night."
  - speaker: patient
    text: "Okay. My husband Taras will be thrilled, he's tired of the flakes on the couch."
  - speaker: clinician
    text: "Ha. And if you ever do get joint pain, swelling, or morning stiffness, tell me right away, because psoriasis can affect the joints and that changes treatment. Best number to reach you with lab results?"
  - speaker: patient
    text: "555-0134."
  - speaker: clinician
    text: "Great. Once the labs and insurance approval come back, we'll have you in for the first injection and teach you how to do it. Otherwise follow-up in 6 weeks."
  - speaker: patient
    text: "Thank you, Dr. Nair. I'm actually hopeful."
