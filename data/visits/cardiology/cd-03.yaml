dialogue:
  - speaker: clinician
    text: Hi Mr. Whitaker, I'm Megan Kowalczyk, the nurse practitioner in the heart failure clinic. Can you confirm your full name and date of birth for me?
  - speaker: patient
    text: Darnell Whitaker. February 27th, 1958.
  - speaker: clinician
    text: Thank you. The nurse said you called on Monday about some swelling. What's been happening?
  - speaker: patient
    text: Yeah, my ankles have been puffing up for about a week. My shoes are tight by the afternoon. And the scale says I'm up 7 pounds.
  - speaker: clinician
    text: Okay. What's your usual weight at home?
  - speaker: patient
    text: I'm usually right around 182. This morning it was 189.
  - speaker: clinician
    text: And how's your breathing?
  - speaker: patient
    text: Worse than usual. Normally I can walk 3 blocks to the corner store. Now I'm winded after about 1 block.
  - speaker: clinician
    text: How many pillows are you sleeping on?
  - speaker: patient
    text: I've gone from 1 pillow to 2. Feels easier to breathe propped up.
  - speaker: clinician
    text: Are you waking up at night gasping for air?
  - speaker: patient
    text: No, not that.
  - speaker: clinician
    text: Any chest pain, or feeling like you might pass out?
  - speaker: patient
    text: No chest pain. No passing out.
  - speaker: clinician
    text: Anything different with your diet the last couple of weeks?
  - speaker: patient
    text: Well, my nephew got married two weekends ago. There was a lot of ham, a lot of salty food. I wasn't careful, I'll admit it. My wife Lorraine already gave me an earful.
  - speaker: clinician
    text: That happens. Let's go through your medicines. You're on sacubitril valsartan, 49 and 51 milligrams twice a day, carvedilol 12.5 milligrams twice a day, spironolactone 25 milligrams once a day, and dapagliflozin 10 milligrams once a day. Still taking all of those?
  - speaker: patient
    text: Every one of them. Lorraine fills my pill box on Sundays.
  - speaker: clinician
    text: And the furosemide, how much are you taking?
  - speaker: patient
    text: The water pill is 20 milligrams in the morning. Wait, no, it's the 40. They changed it in the summer, it's 40.
  - speaker: clinician
    text: Yes, 40 milligrams once a day is what I have. Anything over the counter?
  - speaker: patient
    text: Um, I've been taking naproxen for my knees. The arthritis acts up. Two of the 220 milligram pills, twice a day, for about two weeks.
  - speaker: clinician
    text: Okay, that's important, I'll come back to that. Let me check you over. Your weight here is 189 pounds. Blood pressure is 112 over 70, pulse 78, and oxygen is 95 percent on room air. Your neck veins are up to about 10 centimeters. I hear some crackles at the bottom of both lungs. Heart is regular, and I hear a soft extra sound called an S3. And you've got 2 plus pitting swelling up to the middle of both shins.
  - speaker: patient
    text: That doesn't sound great.
  - speaker: clinician
    text: It tells me you're holding onto extra fluid. Your last echo in March showed an ejection fraction of 30 percent, so your heart pump is weaker than normal, and it's sensitive to salt. Your labs from 3 weeks ago were okay, potassium 4.6 and creatinine 1.2.
  - speaker: patient
    text: So what do we do?
  - speaker: clinician
    text: So this is a mild flare of your heart failure with reduced ejection fraction. I think the salty food and the naproxen both played a part. Naproxen makes the kidneys hold onto salt and water, so I want you to stop it completely.
  - speaker: patient
    text: What do I take for the knees, then?
  - speaker: clinician
    text: Acetaminophen is safer for your heart. You can take 650 milligrams up to 3 times a day. For the fluid, I'm increasing the furosemide to 40 milligrams twice a day for the next 5 days. Once your weight is back near 183, go back to 40 milligrams once a day.
  - speaker: patient
    text: Okay, 40 twice a day for 5 days.
  - speaker: clinician
    text: Right. Keep all your other heart medicines the same. Weigh yourself every morning after you use the bathroom and write it down. Keep salt under 2000 milligrams a day and fluids to about 2 liters.
  - speaker: patient
    text: Lorraine's going to love that. She's been on me about the salt.
  - speaker: clinician
    text: I'd also like a basic metabolic panel on the 21st of October, to make sure your kidneys and potassium are okay with the higher dose. Call us if your weight goes up 3 pounds in a day or 5 pounds in a week. If you're short of breath at rest, or you get chest pain, go to the emergency room.
  - speaker: patient
    text: Got it.
  - speaker: clinician
    text: And are you using the patient portal? I can send you the instructions there.
  - speaker: patient
    text: Yes, it's darnell dot whitaker at examplemail dot com.
  - speaker: clinician
    text: Perfect. I'll send the plan there, and I want to see you back in 1 week to check your weight and the swelling.
  - speaker: patient
    text: Sounds good. Thank you, Megan.
