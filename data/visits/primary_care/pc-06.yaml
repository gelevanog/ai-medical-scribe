  name: Dr. Daniel Reyes
  role: family physician
speakers:
  clinician: {sex: male}
  patient: {sex: female}
dialogue:
  - speaker: clinician
    text: Hi, come on in. Can you give me your full name and date of birth?
  - speaker: patient
    text: Aisha Bello, March 11th, 1997.
  - speaker: clinician
    text: Thanks, Aisha. The nurse said you're having some burning?
  - speaker: patient
    text: Yeah. Since Saturday, so two days. It burns when I pee, and I feel like I have to go every 20 minutes, even when nothing much comes out.
  - speaker: clinician
    text: That sounds miserable. Any pain in your lower belly?
  - speaker: patient
    text: Kind of a pressure, right down low.
  - speaker: clinician
    text: Have you seen any blood in your urine?
  - speaker: patient
    text: No, I don't think so. It's been orange since yesterday, but that's the AZO I took.
  - speaker: clinician
    text: Good that you mentioned it. How much of the AZO?
  - speaker: patient
    text: The box says two tablets three times a day, so I did that yesterday and once this morning.
  - speaker: clinician
    text: Okay. Any fever or chills?
  - speaker: patient
    text: No fever.
  - speaker: clinician
    text: Pain in your back or your side, up here under the ribs?
  - speaker: patient
    text: Nope.
  - speaker: clinician
    text: Nausea or vomiting?
  - speaker: patient
    text: No.
  - speaker: clinician
    text: Any vaginal discharge, itching, or odor?
  - speaker: patient
    text: No, nothing like that.
  - speaker: clinician
    text: When was your last period, and what are you using for birth control?
  - speaker: patient
    text: My period ended about two weeks ago, totally normal. I have the copper IUD, I got it last year.
  - speaker: clinician
    text: Any chance of pregnancy otherwise?
  - speaker: patient
    text: No, I don't think so.
  - speaker: clinician
    text: Have you had a bladder infection before?
  - speaker: patient
    text: Once, in college. Maybe three years ago. It cleared up with antibiotics and I've been fine since. My roommate swears by cranberry pills, so I've been drinking cranberry juice too.
  - speaker: clinician
    text: Cranberry won't hurt, but it won't cure it. Any allergies to medications?
  - speaker: patient
    text: None.
  - speaker: clinician
    text: Okay. Your temperature is 98.2, blood pressure 118 over 72, pulse 80. Let me press on your belly. There's mild tenderness right above the pubic bone. And tapping on your back, any pain?
  - speaker: patient
    text: No, that's fine.
  - speaker: clinician
    text: No tenderness over the kidneys. We did a urine dip here in the office. It's positive for white blood cells and positive for nitrites. No blood and no protein. One thing, though. The AZO can tint the dip and throw off the colors, so I'm also sending your urine for a culture to be sure.
  - speaker: patient
    text: Okay, makes sense.
  - speaker: clinician
    text: So this looks like a simple bladder infection, what we call acute cystitis. I'm going to start you on nitrofurantoin, 100 milligrams twice a day for 5 days. Take it with food, it's easier on the stomach.
  - speaker: patient
    text: Okay. Can you send it to the pharmacy on Kessler Road? And can I keep taking the AZO?
  - speaker: clinician
    text: I'll send it there. You can keep the AZO, but only for one more day, so two days total. Drink plenty of water. The culture takes 2 to 3 days. If it shows something the nitrofurantoin doesn't cover, we'll call you and switch. Is 555-0118 the best number?
  - speaker: patient
    text: Yes, that's my cell.
  - speaker: clinician
    text: And if you develop fever, back or side pain, or vomiting, that could mean the infection is moving up to the kidneys, so call us the same day. If you're not better in 2 to 3 days, let us know. Otherwise, no follow-up needed.
  - speaker: patient
    text: Great. Thank you so much.
  - speaker: clinician
    text: You're welcome, Aisha. Feel better.
