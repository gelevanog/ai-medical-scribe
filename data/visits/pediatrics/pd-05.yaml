dialogue:
  - speaker: clinician
    text: Hi, good to see you both. Zainab, that's a beautiful drawing. Can Dad give me your full name and birthday?
  - speaker: caregiver
    text: Zainab Haddad, February 14th, 2017. She's a Valentine's baby.
  - speaker: clinician
    text: I remember. Thanks, Karim. So this is her ADHD follow-up. How are things going on the medicine?
  - speaker: caregiver
    text: Honestly, school is way better. She's on the 36 milligrams every morning. Oh, no, sorry, it's 27. The 36 was what you said we might try later.
  - speaker: clinician
    text: Right, we went from 18 to 27 milligrams of the long-acting methylphenidate in August. Does she take it every morning?
  - speaker: caregiver
    text: Every school day, around 7, before the bus. Weekends too, mostly.
  - speaker: clinician
    text: And how's school going? She's in 4th grade at Riverside Elementary now, right?
  - speaker: caregiver
    text: Yes. Her teacher, Ms. Kowalski, says she's finishing her work and not getting up out of her seat as much. Her reading grade went from a C to a B.
  - speaker: clinician
    text: That's great to hear. I got the Vanderbilt forms back from both of you. On the teacher form she has 3 out of 9 attention symptoms now, down from 7 in the spring, and the hyperactivity score is down too. Your form looks similar.
  - speaker: caregiver
    text: Yeah, she's calmer. The only thing is her eating.
  - speaker: clinician
    text: Tell me about that.
  - speaker: caregiver
    text: She barely eats lunch. The lunch comes home basically untouched. Then at 4 o'clock she's starving and eats everything in the kitchen.
  - speaker: clinician
    text: That's the most common side effect. How about breakfast?
  - speaker: caregiver
    text: A little cereal, maybe. She's not a big breakfast person.
  - speaker: clinician
    text: Okay. And sleep?
  - speaker: caregiver
    text: It takes her a while to fall asleep, maybe 45 minutes. I bought melatonin at the store, 3 milligrams, and gave it for about a week, but she said she had weird dreams, so I stopped it.
  - speaker: clinician
    text: That's fair. Any headaches or stomachaches?
  - speaker: caregiver
    text: No, not really.
  - speaker: clinician
    text: Any tics, like eye blinking or throat clearing?
  - speaker: caregiver
    text: No.
  - speaker: clinician
    text: Does she seem sad, or really irritable when it wears off in the evening?
  - speaker: caregiver
    text: A little grumpy right after school, but she's herself. Not sad.
  - speaker: clinician
    text: Any fainting, chest pain, or racing heart, especially with running around?
  - speaker: caregiver
    text: No, nothing like that. Her brother Omar has ADHD too, he takes guanfacine, and he had the same thing with appetite on a stimulant, so I kind of expected it.
  - speaker: clinician
    text: That's helpful. Okay, her vitals. Blood pressure is 104 over 66, heart rate 94. Her weight is 28.2 kilograms, and in August it was 29.0, so she's lost about 0.8 kilograms, almost 2 pounds. Height is 134 centimeters, so she's still growing taller. Her heart sounds regular, no murmur, and lungs are clear.
  - speaker: caregiver
    text: 2 pounds. Is that a problem?
  - speaker: clinician
    text: It's something we watch, not something to panic about. So, her ADHD, combined type, is responding well to the 27 milligrams, and I don't want to lose that. But the medicine is suppressing her appetite and she's lost some weight. So here's the plan. Keep the methylphenidate at 27 milligrams every morning.
  - speaker: caregiver
    text: Okay.
  - speaker: clinician
    text: Give it with breakfast, and make breakfast bigger and higher calorie, like eggs, a smoothie with peanut butter, whatever she'll eat. Pack a snack she likes for lunch, and a real snack after school and before bed. On weekends, if her behavior is okay, it's fine to skip the dose to let her catch up on eating.
  - speaker: caregiver
    text: Oh, okay, that's good to know.
  - speaker: clinician
    text: For sleep, screens off by 8, same bedtime every night. If she's still taking a long time to fall asleep, we can try melatonin again at 1 milligram instead of 3.
  - speaker: caregiver
    text: Makes sense. Can you send the prescription to the pharmacy at 2210 Kenwood Avenue?
  - speaker: clinician
    text: Yes, a 30-day supply. Let's have her come in for a nurse weight check on Tuesday, November 24th, and I'll see her in 3 months. If her weight keeps dropping, we could think about a different medicine, but let's not jump ahead.
  - speaker: caregiver
    text: November 24th, got it. And if anything comes up, you have my cell, 555-0147.
  - speaker: clinician
    text: Perfect. Keep up the good work, Zainab. And save me one of those drawings next time.
