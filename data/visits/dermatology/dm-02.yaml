  clinician: {sex: female}
  patient: {sex: female}
dialogue:
  - speaker: clinician
    text: "Hi, I'm Dr. Mei-Ling Chou. Come on in, have a seat. Can you tell me your full name and date of birth?"
  - speaker: patient
    text: "Adaeze Okafor. February 14th, 2005."
  - speaker: clinician
    text: "Valentine's baby. Okay, Adaeze, what brings you in?"
  - speaker: patient
    text: "My acne. I've had it since like, 18, but the last 6 months it's gotten so much worse. It's on my face and some on my upper back."
  - speaker: clinician
    text: "What have you tried so far?"
  - speaker: patient
    text: "I used a benzoyl peroxide wash, the 10 percent one, for about a month. But I stopped it in the summer because it bleached all my towels and my pillowcases."
  - speaker: clinician
    text: "That's really common. Did it help at all while you were using it?"
  - speaker: patient
    text: "A little, I guess. Not enough."
  - speaker: clinician
    text: "Any medicines or supplements you take?"
  - speaker: patient
    text: "I'm on the birth control pill, the norgestimate one, once a day. And vitamin D3, 2000 units a day."
  - speaker: clinician
    text: "Any allergies to medications?"
  - speaker: patient
    text: "Amoxicillin. I got hives all over when I was a kid."
  - speaker: clinician
    text: "Okay. Are your periods regular?"
  - speaker: patient
    text: "Yeah, pretty regular, on the pill anyway."
  - speaker: clinician
    text: "Any extra hair growth on your chin or chest?"
  - speaker: patient
    text: "No."
  - speaker: clinician
    text: "And does the acne leave scars or dark spots?"
  - speaker: patient
    text: "Dark spots, yeah. I don't think scars."
  - speaker: clinician
    text: "Let me take a look. On your forehead, cheeks and jawline you've got lots of open and closed comedones, so blackheads and whiteheads, about 15 red inflamed bumps and maybe 6 pustules. There are a few tender 4 millimeter nodules along the jawline, no large cysts. You have some flat dark brown spots on both cheeks, that's post-inflammatory hyperpigmentation. I don't see any scarring. On the upper back, scattered red papules, maybe 10 or so."
  - speaker: patient
    text: "So is it bad?"
  - speaker: clinician
    text: "I'd call this moderate acne vulgaris, with some dark spots from old breakouts. The good news is it's very treatable. I'd like to start two things. First, adapalene 0.1 percent gel, a pea-sized amount to your whole face at night. Start every other night for the first 2 weeks, because it can make your skin dry and a little peely."
  - speaker: patient
    text: "Okay."
  - speaker: clinician
    text: "Second, doxycycline 100 milligrams twice a day for 3 months. Take it with food and a full glass of water, and stay upright for 30 minutes after, so it doesn't irritate your esophagus. Keep it 2 hours away from dairy, calcium or iron."
  - speaker: patient
    text: "Got it. Is it okay with my birth control?"
  - speaker: clinician
    text: "Yes, it doesn't make your pill less effective. Now, an important question. Is there any chance you could be pregnant right now?"
  - speaker: patient
    text: "No. My last period was 2 weeks ago. But, um, if I did get pregnant, could I keep taking these?"
  - speaker: clinician
    text: "No, and that's a really good question. Doxycycline can affect a baby's teeth and bones, and we don't use adapalene in pregnancy either. So if you ever think you might be pregnant, stop both and call us."
  - speaker: patient
    text: "Okay, that makes sense."
  - speaker: clinician
    text: "The other big thing with doxycycline is sun sensitivity. You can burn really fast on it. So sunscreen, SPF 30 or higher every morning, and a hat if you're out a lot. The adapalene makes you more sun sensitive too."
  - speaker: patient
    text: "I walk across campus all day at Lakeshore State, so I'll be careful."
  - speaker: clinician
    text: "Good. I'd also like you to go back to benzoyl peroxide, but the gentler 4 percent wash, once in the morning. It keeps bacteria from getting resistant to the antibiotic. Use white towels and you won't care about the bleaching."
  - speaker: patient
    text: "Ha, okay. My roommate Priya was on Accutane last year and it totally cleared her up. Should I just do that?"
  - speaker: clinician
    text: "That's a stronger medicine we save for severe or scarring acne. Yours isn't there, so let's see how this does first. Which pharmacy do you use?"
  - speaker: patient
    text: "The one on 4120 Belmont Avenue."
  - speaker: clinician
    text: "Okay, I'll send both there. And a callback number?"
  - speaker: patient
    text: "555-0118."
  - speaker: clinician
    text: "Perfect. It takes 8 to 12 weeks to see the full effect, so hang in there. Let's see you back in 3 months. If you get a really bad sunburn, bad stomach upset or headaches with vision changes on the doxycycline, stop it and call us."
  - speaker: patient
    text: "Will do. Thank you so much."
