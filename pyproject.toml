[project]
name = "notewell"
version = "0.1.0"
description = "Notewell: an AI medical scribe demo. Visit audio to a grounded SOAP note with ICD-10-CM and E/M coding suggestions, PHI masked before any cloud LLM call, clinician review and sign-off, FHIR R4 and PDF export. Synthetic data only; not a medical device."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ivan Savchenko" }]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "fastapi>=0.140",
    "fhir.resources>=8.0",
    "httpx>=0.28",
    "mcp==2.3.0",
    "numpy>=2.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "rich>=13.9",
    "structlog>=24.4",
    "typer>=0.15",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Local speech on CPU: faster-whisper for transcription, Kokoro-82M (ONNX) to synthesize the evaluation audio.
speech = ["faster-whisper>=1.1", "kokoro-onnx>=0.4", "soundfile>=0.12"]

[dependency-groups]
dev = ["hypothesis>=6.120", "mypy>=1.13", "pytest>=8.3", "ruff>=0.8", "types-pyyaml>=6.0"]

[project.scripts]
notewell = "notewell.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notewell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["speech: needs the speech extra and downloaded models (skipped otherwise)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PIE", "RET", "TC"]
ignore = ["TC001", "TC002", "TC003", "RUF001", "RUF002", "RUF003", "E501", "SIM905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.File", "fastapi.Form", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["notewell"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "kokoro_onnx.*", "soundfile.*", "reportlab.*", "fhir.resources.*"]
ignore_missing_imports = true
