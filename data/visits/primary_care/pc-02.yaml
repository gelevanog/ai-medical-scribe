  clinician: {sex: male}
  patient: {sex: female}
dialogue:
  - speaker: clinician
    text: Good afternoon. Can I have you confirm your full name and date of birth?
  - speaker: patient
    text: Guadalupe Rios. June 17th, 1965.
  - speaker: clinician
    text: Thank you, Mrs. Rios. Finally cooling off out there, huh?
  - speaker: patient
    text: Thank God. I can walk in the evenings again without melting.
  - speaker: clinician
    text: That's good to hear, actually, because we're here to talk about your diabetes. Your A1c from last week came back at 8.4 percent. In April it was 7.6.
  - speaker: patient
    text: Ay, I figured it went up. I have to tell you something. I stopped the glipizide.
  - speaker: clinician
    text: Okay, thanks for telling me. When did you stop it, and what happened?
  - speaker: patient
    text: About two months ago. I was getting shaky and sweaty in the afternoons. One time my sugar was 62 and I almost had to pull the car over.
  - speaker: clinician
    text: That's scary, and that was the right instinct. That was the 5 milligrams once a day?
  - speaker: patient
    text: Yes, the 5 in the morning. Since I stopped it, no more lows.
  - speaker: clinician
    text: And the metformin, you're still taking that?
  - speaker: patient
    text: Yes, 1000 milligrams twice a day, with breakfast and dinner. My stomach is fine with it now.
  - speaker: clinician
    text: Good. What are your fasting sugars running at home?
  - speaker: patient
    text: Mostly 150 to 180 in the morning.
  - speaker: clinician
    text: Are you more thirsty than usual, or getting up at night to pee?
  - speaker: patient
    text: Maybe a little more thirsty. Not up at night, no.
  - speaker: clinician
    text: Any numbness or tingling in your feet?
  - speaker: patient
    text: No.
  - speaker: clinician
    text: Any blurry vision? And when was your last eye exam?
  - speaker: patient
    text: My eyes are fine. The eye exam, um, I think it was before COVID. I know, it's been a while.
  - speaker: clinician
    text: We'll take care of that today. And remind me, you're allergic to sulfa?
  - speaker: patient
    text: Yes, the Bactrim. I broke out in a rash all over my body.
  - speaker: clinician
    text: Got it, that's still on your chart. How's the family?
  - speaker: patient
    text: Good. My husband's sugar is worse than mine, they put him on insulin last month. So now we're both checking, it's like a competition.
  - speaker: clinician
    text: Well, I hope you're winning. Let me look at you. Blood pressure is 128 over 76, pulse 80, weight 186 pounds, about the same as April.
  - speaker: clinician
    text: Let me check your feet. Skin looks good, no sores or calluses. Pulses are strong in both feet, and you can feel the monofilament everywhere I touched. Heart and lungs sound normal.
  - speaker: clinician
    text: Your other labs look good too. Kidney function is normal, the filtration rate is 78, and there's no protein in your urine.
  - speaker: patient
    text: Okay, that's good news at least.
  - speaker: clinician
    text: It is. So, to put it together, your type 2 diabetes is above our goal, and the glipizide was causing low sugars, so we'll leave that off for good. Keep the metformin, 1000 milligrams twice a day. I'd like to add a new medicine called empagliflozin, 10 milligrams once a day in the morning. It doesn't usually cause lows, and it also protects the heart and kidneys.
  - speaker: patient
    text: Is it a shot?
  - speaker: clinician
    text: No, it's a pill. It works by letting you pass extra sugar in the urine, so drink plenty of water and keep that area clean. If you get any itching or a yeast infection, call us, it's treatable. If you can't eat or drink because you're sick, skip it that day.
  - speaker: patient
    text: Okay. Water, I can do.
  - speaker: clinician
    text: I'm also putting in a referral for a diabetic eye exam. And keep up the evening walks, they really do help. We'll repeat the A1c in 3 months and see you then.
  - speaker: patient
    text: Can you send the eye doctor info to the portal? My daughter Marisela reads it for me.
  - speaker: clinician
    text: Sure. Is the portal email still lupe rios 65 at example dot com?
  - speaker: patient
    text: That's the one.
  - speaker: clinician
    text: Great. And the empagliflozin goes to your usual pharmacy. Any questions?
  - speaker: patient
    text: No, I think I've got it. Thank you, doctor.
  - speaker: clinician
    text: You're welcome. Enjoy those walks.
