dialogue:
  - speaker: clinician
    text: Morning, Mr. Delacroix. Can you give me your full name and date of birth for the chart?
  - speaker: patient
    text: Raymond Delacroix. April 12th, 1958.
  - speaker: clinician
    text: Thank you. How was the fishing trip you were planning?
  - speaker: patient
    text: Oh, we caught a few redfish. My grandson out-fished me, I won't lie.
  - speaker: clinician
    text: Ha, that's how it goes. So, last time we started trazodone, 50 milligrams at bedtime, for sleep. How did that go?
  - speaker: patient
    text: Well, I gotta be honest, I stopped it. After about ten days.
  - speaker: clinician
    text: That's okay, tell me what happened.
  - speaker: patient
    text: I'd sleep, sure, but in the morning I felt like I was walking through mud. And one night I got up to use the bathroom and got real dizzy, had to grab the dresser.
  - speaker: clinician
    text: I'm glad you stopped it then, and I'm glad you didn't fall. Did you hit anything?
  - speaker: patient
    text: No, no fall. Just scared me.
  - speaker: clinician
    text: So what's sleep like now, without it?
  - speaker: patient
    text: Back to the same. I go to bed around 9:30, lie there an hour, maybe two. Then I wake up about 3 and I'm up for good, most nights.
  - speaker: clinician
    text: Are you taking anything to help?
  - speaker: patient
    text: The Benadryl, the 25 milligrams, most nights. And melatonin, 5 milligrams.
  - speaker: clinician
    text: Okay. Do you nap during the day?
  - speaker: patient
    text: After lunch, an hour or so in the recliner. Since I retired from Crescent City Transit there's not much else to do.
  - speaker: clinician
    text: And coffee? When's your last cup?
  - speaker: patient
    text: I have two. One in the morning and one around 3 in the afternoon.
  - speaker: clinician
    text: Do you watch TV in bed?
  - speaker: patient
    text: Every night. That's how I fall asleep, when I do.
  - speaker: clinician
    text: Does Bernadette ever say you snore loud or stop breathing at night?
  - speaker: patient
    text: No, she says I sleep quiet. She's the one who can't sleep, she takes Ambien and swears by it.
  - speaker: clinician
    text: Any creepy crawly feeling in your legs at night, an urge to move them?
  - speaker: patient
    text: No.
  - speaker: clinician
    text: And how's your mood, are you feeling down or worried a lot?
  - speaker: patient
    text: No, mood's fine. I'm just tired.
  - speaker: clinician
    text: Okay. Your blood pressure sitting is 134 over 80, and standing it's 130 over 78, so no real drop. Pulse is 68. You're alert, a little tired looking, and your thinking is sharp. Your sleep questionnaire score is 18, which is moderate insomnia.
  - speaker: patient
    text: Sounds about right.
  - speaker: clinician
    text: So here's what I think. This is chronic insomnia, and a lot of it comes down to sleep habits that keep it going, the nap, the late coffee, the TV in bed. We won't restart the trazodone, since it made you dizzy. I also want you to stop the Benadryl. At your age it can cause confusion, dizziness, and falls.
  - speaker: patient
    text: Huh. I thought it was harmless since it's over the counter.
  - speaker: clinician
    text: A lot of people do. You can keep melatonin, but drop it to 3 milligrams, an hour before bed. Now the main plan. Get up at 6:30 every day, even weekends. Only go to bed when you're sleepy. No TV in bed. If you're awake more than about 20 minutes, get up, sit in the living room with a book, then go back when you're drowsy.
  - speaker: patient
    text: Okay. What about the nap?
  - speaker: clinician
    text: Skip it if you can, or 20 minutes at most before 2 o'clock. Last coffee by noon. And take a morning walk outside for the daylight.
  - speaker: patient
    text: I can walk the levee with my neighbor.
  - speaker: clinician
    text: Perfect. I'm also referring you to our CBT for insomnia program, it's a 6-session class and it works better than pills long term. Keep a sleep diary for the next two weeks. I'll put the form in your portal. Is your email still ray dot delacroix at bayoumail dot com?
  - speaker: patient
    text: That's it.
  - speaker: clinician
    text: Great. Let's follow up in 6 weeks. If you get confused or have a fall, call us sooner.
  - speaker: patient
    text: Will do. Thank you, ma'am.
