  clinician: {sex: female}
  patient: {sex: male}
dialogue:
  - speaker: clinician
    text: Hi, I'm Dr. Haddad. Can you confirm your full name and date of birth for me?
  - speaker: patient
    text: Tomasz Kowalczyk. May 3rd, 1981.
  - speaker: clinician
    text: Thanks, Tomasz. You're walking a little carefully there. What happened?
  - speaker: patient
    text: Yeah. Saturday I was helping move pallets at work, and I picked up a box of floor tile wrong. Twisted, you know? Felt something grab in my lower back, right side.
  - speaker: clinician
    text: Ouch. Where do you work again?
  - speaker: patient
    text: Harbor Point Distribution. I'm a shift lead in the warehouse.
  - speaker: clinician
    text: Got it. On a scale of 0 to 10, how bad is the pain?
  - speaker: patient
    text: Right now, maybe a 6. When I bend over to tie my shoes, it's like an 8.
  - speaker: clinician
    text: Does it go anywhere, like down your leg?
  - speaker: patient
    text: A little into the right butt cheek. Not down the leg.
  - speaker: clinician
    text: Any numbness or tingling in your legs or feet? Any weakness, like your foot dragging?
  - speaker: patient
    text: No, no numbness. Legs feel normal, just the back.
  - speaker: clinician
    text: I have to ask a few important ones. Any numbness in the groin or between your legs, like where you'd sit on a saddle?
  - speaker: patient
    text: No.
  - speaker: clinician
    text: Any trouble controlling your bladder or bowels, or trouble starting to pee?
  - speaker: patient
    text: No, everything's working fine there.
  - speaker: clinician
    text: Any fevers, unexplained weight loss, or any history of cancer?
  - speaker: patient
    text: None of that.
  - speaker: clinician
    text: Have you had back trouble before?
  - speaker: patient
    text: I had sciatica on the left side maybe six years ago. Did physical therapy and it went away completely, haven't had it since.
  - speaker: clinician
    text: Good. What have you tried so far?
  - speaker: patient
    text: Ibuprofen, two of the 200s a couple times a day, and my wife Agnieszka's heating pad. The heat helps some. I'm kind of worried, though. A guy on my crew herniated a disc doing the same thing and needed surgery.
  - speaker: clinician
    text: That's understandable. Let's take a look. Blood pressure is 134 over 84, pulse 76, temperature 98.4. Can you stand and bend forward for me?
  - speaker: patient
    text: That's about as far as I go.
  - speaker: clinician
    text: Okay, forward bending is limited by pain, about halfway. I can feel tight, tender muscles along the right side of your lower back. No tenderness when I press right on the spine itself. Now lie back. I'm going to raise each leg straight.
  - speaker: patient
    text: Just pulls in the back a little.
  - speaker: clinician
    text: Straight leg raise is negative on both sides. Strength is normal in both legs, reflexes are equal at the knees and ankles, and you can feel my touch the same on both sides. You walked in normally, and you can walk on your heels and toes.
  - speaker: patient
    text: So, is it a disc?
  - speaker: clinician
    text: I don't think so. This looks like a strain of the muscles in your lower back. There are no warning signs, so you don't need an X-ray or MRI right now. Most of these get a lot better in 2 to 4 weeks.
  - speaker: patient
    text: Okay. That's a relief.
  - speaker: clinician
    text: For pain, take ibuprofen 600 milligrams three times a day with food for the next week or so. I'm also prescribing cyclobenzaprine, a muscle relaxer, 5 milligrams at bedtime as needed for spasm. It can make you drowsy, so no driving or running the forklift after you take it.
  - speaker: patient
    text: Got it, only at night.
  - speaker: clinician
    text: Keep using heat, and keep moving. Gentle walking is better than bed rest. I'll write you a note for light duty, no lifting over 20 pounds, through October 15th.
  - speaker: patient
    text: My supervisor will want that. Thanks.
  - speaker: clinician
    text: If you're not better in 2 weeks, come back and we'll start physical therapy. And if you ever lose control of your bladder or bowels, get numb between your legs, or a leg gets weak, go to the emergency room right away.
  - speaker: patient
    text: Okay. Hopefully it doesn't come to that.
  - speaker: clinician
    text: I don't expect it to. Let's plan a follow-up in 2 weeks. Take care of that back, Tomasz.
