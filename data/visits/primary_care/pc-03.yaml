dialogue:
  - speaker: clinician
    text: Hi there. Sorry for the wait. Can you tell me your full name and date of birth?
  - speaker: patient
    text: Kenji Nakamura, January 28th, 1992.
  - speaker: clinician
    text: Thanks, Kenji. You sound pretty stuffed up. What's going on?
  - speaker: patient
    text: Yeah, this cold just won't quit. It started about 10 days ago, runny nose, sore throat, the usual. I was actually getting better, and then like three days ago it got way worse.
  - speaker: clinician
    text: Worse how?
  - speaker: patient
    text: My face hurts. Right here, under my eyes, both sides. And it's like a pressure when I bend over. My upper teeth even ache. And the stuff coming out of my nose is thick and kind of green.
  - speaker: clinician
    text: Any fever?
  - speaker: patient
    text: I took it last night and it was 100.4.
  - speaker: clinician
    text: Okay. Any swelling or redness around your eyes, or changes in your vision?
  - speaker: patient
    text: No, nothing like that.
  - speaker: clinician
    text: Bad headache, stiff neck?
  - speaker: patient
    text: Headache, just the pressure kind. My neck's fine.
  - speaker: clinician
    text: Any cough or shortness of breath?
  - speaker: patient
    text: A little cough from the drip at night. Breathing's fine.
  - speaker: clinician
    text: What have you been taking?
  - speaker: patient
    text: Ibuprofen, like 400 milligrams a couple times a day. And the Afrin spray. Um, I've kind of been using that for six days now.
  - speaker: clinician
    text: Okay, we'll talk about the Afrin. Any allergies to medicines?
  - speaker: patient
    text: Penicillin. I got hives as a kid, my mom says I was covered.
  - speaker: clinician
    text: Good to know. Anybody sick at home?
  - speaker: patient
    text: My girlfriend Hana had the same cold first, but she's totally fine now. The dog's fine too, he's the only one sleeping well.
  - speaker: clinician
    text: Lucky dog. Okay, let me take a look. Temperature here is 99.8, blood pressure 122 over 78, pulse 84, and oxygen is 98 percent.
  - speaker: clinician
    text: Your ear drums look normal. The inside of your nose is swollen and red, and there's thick yellow-green drainage. When I press over your cheeks, is that tender?
  - speaker: patient
    text: Ow. Yes, both sides.
  - speaker: clinician
    text: Tender over both cheek sinuses, not over the forehead. Throat is a little red, no pus on the tonsils. A couple of small tender lymph nodes in your neck. Lungs are clear.
  - speaker: patient
    text: So is it a sinus infection?
  - speaker: clinician
    text: I think so. Most of these are viral, but because you got better and then worse again after a week, with fever and thick drainage, this looks like a bacterial sinus infection in your cheek sinuses. Since you're allergic to penicillin, I'm going to give you doxycycline, 100 milligrams twice a day for 7 days.
  - speaker: patient
    text: Okay.
  - speaker: clinician
    text: Take it with a full glass of water and stay upright for a half hour after, and use sunscreen, it makes you sunburn easily. Now, the Afrin. Please stop it. After three days it causes rebound congestion and can actually make the stuffiness worse.
  - speaker: patient
    text: Oh. That explains a lot.
  - speaker: clinician
    text: Instead, use a saline rinse twice a day, and start fluticasone nasal spray, 2 sprays in each nostril once a day. You can keep the ibuprofen, 400 milligrams up to three times a day with food.
  - speaker: patient
    text: Got it. Can I get a note for work? I teach at Westbrook Middle School and I missed Monday.
  - speaker: clinician
    text: Sure, I'll print one for Monday through today. If you're not starting to feel better in 3 days, or if you get swelling around your eye, trouble seeing, a stiff neck, or a really bad headache, call us right away or go to the emergency room.
  - speaker: patient
    text: Okay. Should I come back?
  - speaker: clinician
    text: Only if it isn't clearing up. We'll call 555-0129 if anything changes with the prescription, is that still right?
  - speaker: patient
    text: Yep, that's my cell.
  - speaker: clinician
    text: Great. Feel better, Kenji.
