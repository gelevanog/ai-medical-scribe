dialogue:
  - speaker: clinician
    text: Hi, Neha, come on in. Can I have your full name and date of birth, please?
  - speaker: patient
    text: Neha Kulkarni, January 25th, 1987.
  - speaker: clinician
    text: Thanks. How did your daughter's soccer tournament go?
  - speaker: patient
    text: They lost in the semifinal, but Anaya scored, so she was over the moon.
  - speaker: clinician
    text: That's great. So how's the mood been?
  - speaker: patient
    text: Good, actually. The bupropion is still working. But, um, there's something I wanted to bring up. My husband Vikram thinks I should talk to you about my drinking.
  - speaker: clinician
    text: I'm glad you did. Tell me what it looks like.
  - speaker: patient
    text: Since I started working from home last year, a glass of wine at 6 turned into three, sometimes four, most nights. Saturdays it can be five or six.
  - speaker: clinician
    text: Do you often end up drinking more than you planned?
  - speaker: patient
    text: Pretty much always. I tell myself one glass.
  - speaker: clinician
    text: Have you tried to cut back?
  - speaker: patient
    text: In August I tried to stop for a month. I made it four days.
  - speaker: clinician
    text: Do you ever drink in the morning, or get shaky or sweaty when you go without?
  - speaker: patient
    text: No, never in the morning, and no shakes.
  - speaker: clinician
    text: Any blackouts, where you can't remember part of the night?
  - speaker: patient
    text: Once. At a wedding in August, I don't remember the end of the night. That kind of scared me.
  - speaker: clinician
    text: Any driving after drinking?
  - speaker: patient
    text: No. Never. I'm really careful about that.
  - speaker: clinician
    text: Any smoking, cannabis, other drugs?
  - speaker: patient
    text: No, none of that.
  - speaker: clinician
    text: Anyone in your family with alcohol problems?
  - speaker: patient
    text: My dad was a heavy drinker. He died of cirrhosis when I was in college.
  - speaker: clinician
    text: I'm sorry. That's a lot to carry. And you're still on bupropion XL, 150 milligrams every morning?
  - speaker: patient
    text: Yes, every morning.
  - speaker: clinician
    text: I have to ask, any thoughts of suicide or of hurting yourself?
  - speaker: patient
    text: No, not at all.
  - speaker: clinician
    text: Good. So, your AUDIT-C score today is 8 out of 12. For women, 3 or more is a positive screen, so this is clearly in the risky range. Your PHQ-9 is 4, so your depression is still in remission. Your blood pressure is a bit high today at 138 over 88, pulse 90. I don't see any tremor in your hands. You seem calm and open, your mood is good, and your thinking is clear.
  - speaker: patient
    text: Okay. Honestly, I figured it would be high.
  - speaker: clinician
    text: So here's where I land. I think this is a mild alcohol use disorder. Your recurrent major depression is in full remission on the bupropion, and I want to keep it that way, because alcohol can bring depression back. There's one more important thing. Bupropion lowers the seizure threshold, and heavy drinking, or stopping suddenly after heavy drinking, raises that risk.
  - speaker: patient
    text: Wow, I didn't know that.
  - speaker: clinician
    text: So what I'd like to do is this. First, a liver panel and a GGT, at the lab on your way out. If those are okay, I'll start naltrexone, 50 milligrams once a day. It cuts cravings and makes drinking less rewarding. I'll call you with the results before you start it.
  - speaker: patient
    text: Okay. Is it the same number on file? 919-555-0117?
  - speaker: clinician
    text: That's what I have. Second, a goal for now, no more than one drink a day and at least three alcohol-free days a week. Third, I'm referring you to the Riverbend Recovery Center outpatient program. They have evening groups twice a week.
  - speaker: patient
    text: Evenings work. Vikram can handle the kids.
  - speaker: clinician
    text: Keep the bupropion at 150. If you get shaky, sweaty, or anxious when you cut down, call us right away. And if your mood drops or you have any thoughts of hurting yourself, call or text 988. We'll recheck your blood pressure next time. Let's meet again in 4 weeks, on October 30th.
  - speaker: patient
    text: Thank you. This is easier to say out loud than I thought.
