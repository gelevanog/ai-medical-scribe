dialogue:
  - speaker: clinician
    text: Morning! Let's start with your full name and date of birth.
  - speaker: patient
    text: Brendan Gallagher, August 30th, 1974.
  - speaker: clinician
    text: Thanks, Brendan. Big weekend coming up?
  - speaker: patient
    text: My daughter Siobhan has a soccer tournament in Canton, so I'll be freezing on the sidelines all Saturday.
  - speaker: clinician
    text: Bring a thermos. So this is your yearly physical. Anything bothering you, or new since last year?
  - speaker: patient
    text: Honestly, I feel fine. No complaints. Well, I want to talk about the smoking. I think I'm ready to quit for real.
  - speaker: clinician
    text: I'm really glad to hear that. We'll spend some time on it. How much are you smoking right now?
  - speaker: patient
    text: About a pack a day. I started when I was 22, so about 30 years.
  - speaker: clinician
    text: Have you tried quitting before?
  - speaker: patient
    text: Yeah, in 2019 I used the patch and made it six months. Then work got stressful and I picked it back up.
  - speaker: clinician
    text: Six months is a real accomplishment, it means you can do it. Any cough, chest pain, or shortness of breath?
  - speaker: patient
    text: Nope, none of those.
  - speaker: clinician
    text: Any blood in your stool, or weight loss you can't explain?
  - speaker: patient
    text: No.
  - speaker: clinician
    text: Alcohol?
  - speaker: patient
    text: Two or three beers a week, maybe.
  - speaker: clinician
    text: Any family history changes?
  - speaker: patient
    text: My mom had breast cancer back in 2021. She did chemo, she's doing great now. Dad's fine, he's 80 and still golfing.
  - speaker: clinician
    text: Glad she's doing well. You're not on any regular medicines, right?
  - speaker: patient
    text: Nothing. Just a multivitamin most days.
  - speaker: clinician
    text: And no allergies to medications?
  - speaker: patient
    text: Not that I know of.
  - speaker: clinician
    text: Okay. Your blood pressure is 132 over 82, pulse 78, and weight is 205 pounds. Let me listen. Heart is regular, no murmurs. Lungs are clear, no wheezing. Belly is soft and non-tender. No swelling in your legs. Everything looks good.
  - speaker: patient
    text: Good, I'll take it.
  - speaker: clinician
    text: Now, a few screening things. You've never had a colonoscopy, right?
  - speaker: patient
    text: Never. I keep putting it off.
  - speaker: clinician
    text: You're 52, so you're due. I'll put in a referral to gastroenterology for a screening colonoscopy. And because you've smoked about 30 pack years, you qualify for a yearly low-dose CT scan of the chest to screen for lung cancer. I'll order that too.
  - speaker: patient
    text: Okay, makes sense.
  - speaker: clinician
    text: And I'd like fasting labs, a cholesterol panel and an A1c to check for diabetes. Your tetanus shot was 2020, so you're up to date there. We do have the flu shot today, would you like it?
  - speaker: patient
    text: Sure, go ahead.
  - speaker: clinician
    text: Great, the nurse will give you the flu shot in your left arm before you leave. Okay, the smoking. Let's pick a quit date. How about November 1st? That's a Sunday.
  - speaker: patient
    text: November 1st. Okay, yeah.
  - speaker: clinician
    text: Since a pack a day is heavy, start the 21 milligram nicotine patch that morning, one patch a day, and use nicotine gum, 2 milligrams, when you get a craving. You can buy both over the counter. Get rid of the lighters and ashtrays, and figure out what you'll do instead after meals and in the car, that's when people slip. You can also call the quit line, 1-800-QUIT-NOW, for free coaching.
  - speaker: patient
    text: The car is the big one for me.
  - speaker: clinician
    text: Keep gum in the cupholder then. We spent about 8 minutes on this, and it's the most important thing you'll do for your health. I'll see you in 1 month to check how the quit is going, and we'll go over the labs then.
  - speaker: patient
    text: Sounds good. Thanks, Dr. Zhou.
  - speaker: clinician
    text: You're welcome. Good luck to Siobhan this weekend.
