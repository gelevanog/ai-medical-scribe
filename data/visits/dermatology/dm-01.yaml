dialogue:
  - speaker: clinician
    text: "Hi there, I'm Dr. Kwame Asante, one of the dermatologists here. Did you find parking okay? That garage is a maze."
  - speaker: patient
    text: "Ha, it really is. I went around twice before I found a spot on level 3."
  - speaker: clinician
    text: "Everybody does. So before we start, can you tell me your full name and date of birth?"
  - speaker: patient
    text: "Aisling Brennan, and my birthday is June 9th, 1988."
  - speaker: clinician
    text: "Thank you, Aisling. Your referral mentions a mole on your back. Tell me what's going on with it."
  - speaker: patient
    text: "So it's on my left upper back, kind of by my shoulder blade. My husband Declan noticed it looked different back in, um, July. He says it's gotten bigger and darker since spring."
  - speaker: clinician
    text: "Okay. Has it bled at all, or crusted over?"
  - speaker: patient
    text: "No. No bleeding."
  - speaker: clinician
    text: "Does it itch or hurt?"
  - speaker: patient
    text: "It itches a little now and then. It doesn't hurt."
  - speaker: clinician
    text: "Have you ever had a skin cancer yourself, or any moles removed?"
  - speaker: patient
    text: "No, I've never had skin cancer, and nothing's ever been removed."
  - speaker: clinician
    text: "Anyone in the family with skin cancer?"
  - speaker: patient
    text: "My dad had a basal cell on his nose a few years ago. They scraped it off and he's been fine."
  - speaker: clinician
    text: "Good to know. How about sun exposure? Sunburns growing up, tanning beds?"
  - speaker: patient
    text: "Oh, lots of sun. I was a lifeguard every summer through college at Crestview Aquatics. I got burned pretty badly a few times, like blistering. Never did tanning beds, though."
  - speaker: clinician
    text: "Got it. Any medicines you take regularly?"
  - speaker: patient
    text: "Just levothyroxine, 75 micrograms every morning, for my thyroid."
  - speaker: clinician
    text: "And any allergies to medications, or to lidocaine or latex?"
  - speaker: patient
    text: "No allergies that I know of."
  - speaker: clinician
    text: "Alright, let me take a look. Can you slip your left arm out of the gown? Okay. So on your left upper back, just over the shoulder blade, there's a 7 millimeter dark brown mole. It's asymmetric, the border is irregular and kind of notched at the bottom, and there's a black area on one side. Under the dermatoscope I see an irregular network and a few dots at the edge. That one stands out from your other moles."
  - speaker: patient
    text: "Is that bad?"
  - speaker: clinician
    text: "It's what we call an ugly duckling, it doesn't look like its neighbors. Let me check the rest of you first. Your back, chest and arms have scattered 2 to 3 millimeter round moles, evenly brown. Those all look like normal benign moles. Scalp, face and legs look fine. I don't feel any swollen lymph nodes in your left armpit or your neck. Any lumps you've noticed in your armpit?"
  - speaker: patient
    text: "No, nothing like that."
  - speaker: clinician
    text: "Okay. So here's what I think. This mole on your back has several changing features. Most of these turn out to be an atypical mole, but I can't rule out an early melanoma just by looking. So I'd like to do a biopsy today."
  - speaker: patient
    text: "Today? Okay. What does that involve?"
  - speaker: clinician
    text: "It's a shave biopsy. I numb the area with a little lidocaine with epinephrine, then I take off the whole mole with a thin blade, fairly deep, and send it to the lab. No stitches. You'll have a shallow wound, kind of like a scrape."
  - speaker: patient
    text: "That's fine. Let's do it."
  - speaker: clinician
    text: "Great. A little pinch and a burn now. Okay, and that's done, it went well. I've sent it to pathology. For care, keep the bandage on for 24 hours, then wash it gently once a day, put on plain petroleum jelly and a fresh bandage every day until it heals. That's usually 1 to 2 weeks."
  - speaker: patient
    text: "Okay. When will I know?"
  - speaker: clinician
    text: "Results take about 7 to 10 days. They'll post to the portal and someone will call you either way. What's the best number for you?"
  - speaker: patient
    text: "My cell, 555-0163. And my portal email is aisling dot brennan 88 at fastmail dot com."
  - speaker: clinician
    text: "Got it. If it does come back as a melanoma, we'd talk about a wider excision to get clear margins, but let's not get ahead of ourselves. If the site gets red, hot, swollen or drains pus, call us."
  - speaker: patient
    text: "Okay. Should I be doing anything about the sun?"
  - speaker: clinician
    text: "Yes. Broad-spectrum sunscreen, SPF 30 or higher, every day on exposed skin, reapply every 2 hours when you're outside, and a wide-brimmed hat. Check your own moles once a month. And since you've had blistering sunburns and quite a few moles, I'd like to see you for a full skin check every year."
  - speaker: patient
    text: "Sounds good."
  - speaker: clinician
    text: "Let's book a follow-up for the biopsy site and results on Tuesday, October 27th. Any other questions?"
  - speaker: patient
    text: "No, I think that's it. Thank you."
  - speaker: clinician
    text: "You're welcome, Aisling. Take care, and good luck getting out of that garage."
