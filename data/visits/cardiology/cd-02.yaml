dialogue:
  - speaker: clinician
    text: Good afternoon, Mrs. Owusu. Nice to see you again. Just so we have the right chart, can you give me your full name and date of birth?
  - speaker: patient
    text: Abena Owusu, November 19th, 1951.
  - speaker: clinician
    text: Perfect. Did your daughter bring you today?
  - speaker: patient
    text: Yes, Efua dropped me at the door. She's parking the car. You can call her if you need anything, her number is 555-0148.
  - speaker: clinician
    text: Good, I'll keep that on file. So this is your 6 month check on the atrial fibrillation. How have you been feeling?
  - speaker: patient
    text: Mostly fine. I don't feel the heart racing like before. Sometimes I'm a little tired in the afternoon, but I'm 74, you know.
  - speaker: clinician
    text: Fair enough. Any shortness of breath, dizziness, or chest pain?
  - speaker: patient
    text: No, none of that.
  - speaker: clinician
    text: Let's go over your medicines. You're on apixaban, 5 milligrams twice a day, and metoprolol succinate 25 milligrams?
  - speaker: patient
    text: The apixaban yes, morning and night. But the metoprolol is 50 now. You went up to 50 in April, remember?
  - speaker: clinician
    text: You're right, I see it here, 50 milligrams once a day. And the lisinopril, 10 milligrams in the morning for the blood pressure?
  - speaker: patient
    text: Yes. And I also take a baby aspirin every day now. My friend Ruth said it's good for the heart, so I started it in the summer. And my fish oil, 1000 milligrams.
  - speaker: clinician
    text: Okay, I'm glad you told me. That's actually something I want to talk about. Have you noticed any bleeding?
  - speaker: patient
    text: My gums bleed a little when I brush. And I had one nosebleed in August, but it stopped on its own after about 10 minutes and it hasn't happened again.
  - speaker: clinician
    text: Any black or tarry stools, or blood in your urine?
  - speaker: patient
    text: No.
  - speaker: clinician
    text: Any falls since I last saw you?
  - speaker: patient
    text: No falls, thank God. I walk with my church group twice a week.
  - speaker: clinician
    text: That's great. Okay, your blood pressure is 132 over 78, and your pulse is 72 and irregular, which is expected with the atrial fibrillation. Weight is 148 pounds, same as last time. Heart is irregularly irregular, no murmur. Lungs are clear, and no swelling in your ankles.
  - speaker: patient
    text: Okay.
  - speaker: clinician
    text: We did an ECG today. It shows atrial fibrillation with a rate of 74, so your rate is well controlled on the metoprolol. Your labs from last month look good too. Hemoglobin was 12.9, and kidney function was normal, creatinine 0.9.
  - speaker: patient
    text: So the blood is okay?
  - speaker: clinician
    text: Yes, no sign that you're losing blood. Now let me explain the balance. Your stroke risk score is 3, because of your age, being a woman, and the high blood pressure. That's high enough that the apixaban really protects you from a stroke. And your dose of 5 milligrams twice a day is the right one for your age, weight and kidneys.
  - speaker: patient
    text: Okay.
  - speaker: clinician
    text: The flip side is bleeding. Your bleeding risk score is 2 right now, and one of those points is the aspirin. Taking aspirin on top of apixaban raises the bleeding risk quite a bit, and for your heart it doesn't add protection. So I'd like you to stop the aspirin.
  - speaker: patient
    text: Oh. Ruth will be surprised. Okay, I'll stop it.
  - speaker: clinician
    text: Ruth's situation may be different. For you, the apixaban is doing the job. The fish oil at that dose is fine to keep. Use a soft toothbrush, and mention the gums to your dentist at your next cleaning.
  - speaker: patient
    text: I can do that.
  - speaker: clinician
    text: So to sum up. This is permanent atrial fibrillation, rate controlled, on long term anticoagulation, and your blood pressure is at goal. Keep the apixaban 5 milligrams twice a day, metoprolol succinate 50 milligrams once a day, and lisinopril 10 milligrams. Stop the aspirin. We'll check a blood count again in 3 months, you can do that at the lab on 2210 Wexford Avenue.
  - speaker: patient
    text: Yes, that's close to my house.
  - speaker: clinician
    text: Call us if you see black stools, blood in the urine, or a nosebleed that won't stop after 20 minutes. And if you ever fall and hit your head, go to the emergency room, even if you feel fine, because of the blood thinner.
  - speaker: patient
    text: Okay, I'll remember.
  - speaker: clinician
    text: I'll see you back in 6 months. Say hi to Efua for me.
  - speaker: patient
    text: I will. Thank you, doctor.
