  name: Dr. Samir Haddad
  role: dermatologist
speakers:
  clinician: {sex: male}
  patient: {sex: male}
dialogue:
  - speaker: clinician
    text: "Hey, good to see you again. Just to confirm, full name and date of birth?"
  - speaker: patient
    text: "Hyun-woo Park, November 3rd, 1996."
  - speaker: clinician
    text: "Thanks, Hyun-woo. It's been, what, a year and a half? What's going on?"
  - speaker: patient
    text: "My eczema's back, bad. It started flaring about 3 weeks ago, right after I started a new job at Brightline Logistics. The warehouse is freezing and super dry."
  - speaker: clinician
    text: "Where is it this time?"
  - speaker: patient
    text: "Inside both elbows, behind my knees, my neck, and the backs of my hands are cracking."
  - speaker: clinician
    text: "On a scale of 0 to 10, how bad is the itch?"
  - speaker: patient
    text: "Like an 8. It wakes me up at night. My girlfriend Jisoo says I'm scratching in my sleep."
  - speaker: clinician
    text: "That's rough. Any oozing, or yellow crusting?"
  - speaker: patient
    text: "No, nothing like that."
  - speaker: clinician
    text: "Fevers?"
  - speaker: patient
    text: "Nope."
  - speaker: clinician
    text: "Any new soaps, detergents, or lotions?"
  - speaker: patient
    text: "No, same stuff as always."
  - speaker: clinician
    text: "What have you been putting on it?"
  - speaker: patient
    text: "I ran out of the triamcinolone you gave me last time, so I've been using the drugstore hydrocortisone, the 2.5 percent. Wait, no, it's the 1 percent. The 2.5 needs a prescription, right?"
  - speaker: clinician
    text: "Right, the 1 percent is the over-the-counter one. And it's just not strong enough for this. Anything else you take?"
  - speaker: patient
    text: "Cetirizine, 10 milligrams every day for my seasonal allergies."
  - speaker: clinician
    text: "Okay. And you had asthma as a kid, right? Any breathing trouble now?"
  - speaker: patient
    text: "No, I outgrew that. I haven't used an inhaler since I was like 12."
  - speaker: clinician
    text: "Good. Still no drug allergies?"
  - speaker: patient
    text: "None."
  - speaker: clinician
    text: "Alright, let's look. In both elbow creases there are red, scaly, thickened plaques, about 6 by 4 centimeters each, with scratch marks. Same thing behind both knees, a bit smaller. There's a patch of dry, red skin on the back of your neck. The backs of both hands are dry with a few small cracks over the knuckles. No weeping and no honey-colored crusting, so I don't see signs of infection. Your face and eyelids are clear. I'd estimate about 10 percent of your body surface."
  - speaker: patient
    text: "Yeah, that sounds about right."
  - speaker: clinician
    text: "So this is a flare of your atopic dermatitis, probably set off by the cold, dry air at work. Here's the plan. I'm restarting triamcinolone 0.1 percent ointment, twice a day to the patches on your body and hands, for 2 weeks. Then cut back to just weekends, Saturday and Sunday, on the spots that like to come back. Don't use it on your face or groin."
  - speaker: patient
    text: "Ointment, not the cream?"
  - speaker: clinician
    text: "Ointment. It's greasier but it works better on dry, cracked skin and it stings less. You can stop the hydrocortisone. For the itch at night, let's add hydroxyzine 25 milligrams at bedtime as needed. It'll make you drowsy, so don't drive after taking it. Keep the cetirizine in the morning."
  - speaker: patient
    text: "Okay."
  - speaker: clinician
    text: "Moisturizing is half the battle. A thick, fragrance-free cream or plain petroleum jelly at least twice a day, and right after a short, lukewarm shower. At work, wear cotton-lined gloves when you can. I can write a note for that."
  - speaker: patient
    text: "That would help, yeah."
  - speaker: clinician
    text: "If it keeps flaring even with all this, there are newer options like dupilumab, an injection, and we can talk about it then. And if you see oozing, yellow crusts, or you get a fever, call us right away, that could be an infection."
  - speaker: patient
    text: "Got it. Should I call the same number?"
  - speaker: clinician
    text: "Yes. And we have 555-0177 for you, is that still right?"
  - speaker: patient
    text: "That's still me."
  - speaker: clinician
    text: "Great. Let's see you back in 4 weeks, on Monday, November 2nd, and see how the skin's doing."
  - speaker: patient
    text: "Sounds good. Thanks, Dr. Haddad."
