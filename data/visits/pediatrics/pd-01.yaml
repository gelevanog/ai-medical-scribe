dialogue:
  - speaker: clinician
    text: Hi there, come on in. Oh, I love those purple boots. Okay, before we get going, can you confirm her full name and date of birth for me?
  - speaker: caregiver
    text: Yeah, it's Amara Okafor, July 18th, 2023.
  - speaker: clinician
    text: Perfect. And you're mom?
  - speaker: caregiver
    text: I am, I'm Chiamaka. Sorry, I look like a mess, it's been a long night.
  - speaker: clinician
    text: No apology needed. Tell me what's going on with Amara.
  - speaker: caregiver
    text: So she started with a fever yesterday afternoon, and she's been pulling at her left ear, like, nonstop. Last night it went up to 102.8 and she was up crying most of the night.
  - speaker: clinician
    text: Oh, poor thing. Did you give her anything for it?
  - speaker: caregiver
    text: I gave her the children's Tylenol around 2 in the morning, 5 milliliters, and that helped a little. Nothing since then.
  - speaker: clinician
    text: Okay. Has she had a cold leading up to this?
  - speaker: caregiver
    text: Yeah, runny nose and a little cough for maybe 4 or 5 days. At her daycare, Little Acorns, half the room has been sick. And her cousin just had hand, foot and mouth, so I was kind of worried about that too.
  - speaker: clinician
    text: Any sores in her mouth, or a rash on her hands or feet?
  - speaker: caregiver
    text: No, I looked. Nothing.
  - speaker: clinician
    text: Good. How's she eating and drinking?
  - speaker: caregiver
    text: Eating, not much. But she's drinking okay, juice and water mostly.
  - speaker: clinician
    text: And is she peeing normally?
  - speaker: caregiver
    text: Yeah, she's mostly potty trained, just a pull-up at night. She peed this morning, a normal amount.
  - speaker: clinician
    text: Any vomiting or diarrhea?
  - speaker: caregiver
    text: Nope.
  - speaker: clinician
    text: Any drainage coming out of the ear?
  - speaker: caregiver
    text: No, nothing like that.
  - speaker: clinician
    text: Has she had ear infections before?
  - speaker: caregiver
    text: Just one, when she was about 1. It cleared up with the pink medicine and she's been fine since.
  - speaker: clinician
    text: And she's not allergic to any medicines?
  - speaker: caregiver
    text: No allergies that we know of.
  - speaker: clinician
    text: Great. So her weight today is 16 kilograms, that's about 35 pounds. Temperature here is 101.6, heart rate 128, and her oxygen is 99 percent. Amara, can I peek in your ears with my little flashlight? Good job, sweetie.
  - speaker: caregiver
    text: She hates this part.
  - speaker: clinician
    text: She's doing great. Okay, her right eardrum looks normal. The left one is red and bulging, and I can see pus behind it. Her throat is a little red, but no sores or blisters. Lungs sound clear, no wheezing, and her neck is nice and soft.
  - speaker: caregiver
    text: So it's an ear infection?
  - speaker: clinician
    text: Yes, this is an acute ear infection in her left ear, on top of a cold. With a fever as high as 102.8 and that bulging eardrum, I do recommend an antibiotic. We'll use amoxicillin at the higher dose, 90 milligrams per kilogram per day. She's 16 kilograms, so that's 1440 milligrams a day, split into 2 doses, so 720 milligrams twice a day.
  - speaker: caregiver
    text: Okay, and how much is that in the liquid?
  - speaker: clinician
    text: The pharmacy will give you the 400 milligrams per 5 milliliters strength, so it's 9 milliliters twice a day, for 10 full days, even if she seems better after a couple of days.
  - speaker: caregiver
    text: Got it. 9 milliliters twice a day for 10 days.
  - speaker: clinician
    text: Exactly. For pain and fever you can use ibuprofen. Her dose is 160 milligrams, which with the children's liquid is 8 milliliters, every 6 to 8 hours as needed. The Tylenol is fine too, every 4 to 6 hours, but for her weight it's 7 and a half milliliters, not 5. So the 5 you gave was a little low.
  - speaker: caregiver
    text: Oh, I didn't know that. Okay, 7 and a half.
  - speaker: clinician
    text: Which pharmacy do you want the amoxicillin sent to?
  - speaker: caregiver
    text: The one on Euclid Avenue, by the library. 4410 Euclid.
  - speaker: clinician
    text: Got it. And is 555-0163 still the best number for you?
  - speaker: caregiver
    text: Yes, that's my cell. Um, should I worry about her baby brother? He's got the runny nose now too.
  - speaker: clinician
    text: The ear infection itself isn't contagious, it's the cold that spreads. Just watch him, and if he gets a fever or starts pulling at his ears, bring him in.
  - speaker: caregiver
    text: Okay, good.
  - speaker: clinician
    text: As for Amara, she can go back to daycare once she's been fever-free for 24 hours without medicine. If she's still running fevers or in a lot of pain after 48 to 72 hours on the amoxicillin, call us, because we may need to switch antibiotics. And if you see swelling or redness behind the ear, or she's really hard to wake up, bring her in right away.
  - speaker: caregiver
    text: Okay. Does she need to come back to get the ear checked?
  - speaker: clinician
    text: If she's back to herself in a few days, no routine recheck. If she gets another ear infection in the next couple of months, we'll want to see her.
  - speaker: caregiver
    text: Sounds good. I just hope my parking meter hasn't run out.
  - speaker: clinician
    text: Ha, they're strict out there, so go, go. Feel better, Amara.
