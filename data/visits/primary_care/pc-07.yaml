dialogue:
  - speaker: clinician
    text: Welcome, I'm Dr. Al-Amin. Since you're new with us, let's confirm your full name and date of birth.
  - speaker: patient
    text: Svetlana Petrova. December 4th, 1979.
  - speaker: clinician
    text: And your new address?
  - speaker: patient
    text: 4417 Juniper Ridge Drive. We moved here from Pittsburgh in August.
  - speaker: clinician
    text: How's the move going?
  - speaker: patient
    text: Boxes everywhere still. But the weather is much nicer, I won't miss the snow.
  - speaker: clinician
    text: I'll bet. So I have the records your old doctor, Dr. Ostrowski, sent over. Tell me about your thyroid.
  - speaker: patient
    text: I was diagnosed with Hashimoto's in 2015. I take levothyroxine, 88 micrograms every morning.
  - speaker: clinician
    text: How do you take it? With food, coffee?
  - speaker: patient
    text: Um, honestly, with my coffee and my calcium, all together. It's the only way I remember.
  - speaker: clinician
    text: Okay, that's really common, and it's important. I'll come back to that. How have you been feeling?
  - speaker: patient
    text: A little more tired than usual, and I'm always cold. But I've also been moving furniture for two months, so who knows.
  - speaker: clinician
    text: Any constipation, hair thinning, or weight changes?
  - speaker: patient
    text: No, my weight is the same. Hair's fine.
  - speaker: clinician
    text: Any racing heart or palpitations?
  - speaker: patient
    text: No.
  - speaker: clinician
    text: Your last TSH in the records, from May, was 5.8, which is a bit high. And your cholesterol panel from May shows total cholesterol 248, LDL 164, HDL 52, and triglycerides 160.
  - speaker: patient
    text: Dr. Ostrowski said to work on diet. I'm not on anything for it.
  - speaker: clinician
    text: Any heart disease in the family?
  - speaker: patient
    text: My father had a heart attack at 58. He's okay now, he had stents.
  - speaker: clinician
    text: Any other supplements besides the calcium?
  - speaker: patient
    text: Vitamin D, 2000 units a day. And a hair, skin and nails gummy, I think it has biotin. The calcium is 600 milligrams once a day.
  - speaker: clinician
    text: Do you smoke?
  - speaker: patient
    text: Never.
  - speaker: clinician
    text: Any allergies to medicines?
  - speaker: patient
    text: Codeine makes me throw up, really badly.
  - speaker: clinician
    text: Got it. Your blood pressure is 124 over 78, pulse 66, weight 158 pounds. Let me feel your neck. Thyroid isn't enlarged and I don't feel any nodules. Skin is a little dry. Heart is regular, lungs are clear, and your reflexes are normal.
  - speaker: patient
    text: Okay.
  - speaker: clinician
    text: So, two things. First, your hypothyroidism from Hashimoto's. The TSH was a little high, and I think part of that is the way you're taking the pill. Coffee and calcium both block absorption. Take the levothyroxine alone with water, first thing in the morning, at least 30 to 60 minutes before coffee or breakfast. And take the calcium at least 4 hours later, with dinner is easiest.
  - speaker: patient
    text: Oh. I had no idea.
  - speaker: clinician
    text: Keep the dose at 88 micrograms for now. I'll recheck the TSH and a free T4 in 6 weeks, once you've been taking it the right way. Stop the biotin gummy 3 days before that blood draw, because biotin can throw off thyroid tests.
  - speaker: patient
    text: Okay. And if it's still high?
  - speaker: clinician
    text: If the TSH is still above 4.5, we'd go up to 100 micrograms. But let's see first.
  - speaker: clinician
    text: Second, your cholesterol is high, and an underactive thyroid can raise cholesterol. So I'd like a fasting lipid panel with the thyroid labs, and then we'll talk about your overall heart risk, especially with your father's history. Meanwhile, more fiber, less saturated fat, and regular exercise.
  - speaker: patient
    text: That sounds reasonable.
  - speaker: clinician
    text: I'll see you in 6 to 8 weeks after the labs. Can I get an email for the portal?
  - speaker: patient
    text: Sure, it's s petrova 79 at example dot com.
  - speaker: clinician
    text: Perfect. Welcome to the practice, Svetlana.
