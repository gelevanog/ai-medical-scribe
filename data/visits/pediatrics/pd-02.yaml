dialogue:
  - speaker: clinician
    text: Hey, buddy. Hi, Dad. I'm Dr. Asante. Can you give me his full name and birthday, just so I know I've got the right chart?
  - speaker: caregiver
    text: Mateo Villanueva, April 2nd, 2019. I'm his dad, Andrés.
  - speaker: clinician
    text: Thanks, Andrés. So, Mateo, I hear your throat hurts?
  - speaker: caregiver
    text: Yeah, he's been complaining since Saturday. No, wait, Friday. It was Friday night, after his soccer game. He said it hurt to swallow, and then Sunday he got a fever.
  - speaker: clinician
    text: How high has the fever gotten?
  - speaker: caregiver
    text: The highest was 102.4 last night. I gave him ibuprofen this morning at like 7, so that might be bringing it down.
  - speaker: clinician
    text: Good to know. Mateo, does your tummy hurt at all?
  - speaker: caregiver
    text: He said his stomach hurt yesterday. Didn't throw up, though.
  - speaker: clinician
    text: Okay. Any cough?
  - speaker: caregiver
    text: No, not really.
  - speaker: clinician
    text: Runny nose or stuffy nose?
  - speaker: caregiver
    text: No. That's kind of why I thought, this isn't just a cold. A mom from his class texted that there's strep going around at Brookside Elementary.
  - speaker: clinician
    text: Yeah, we've been seeing a lot of it this month. Any rash on his body?
  - speaker: caregiver
    text: I didn't see one.
  - speaker: clinician
    text: Is he drinking okay?
  - speaker: caregiver
    text: Drinking, yes, eating not so much. Popsicles mostly.
  - speaker: clinician
    text: Popsicles are perfect, honestly. Now, I see in the chart he's allergic to amoxicillin. Is that right?
  - speaker: caregiver
    text: Yeah, when he was 3 he got hives all over, like big red welts, from the pink amoxicillin. No trouble breathing or anything, just the hives.
  - speaker: clinician
    text: Okay, that's helpful. Any other medicines, any daily medicines?
  - speaker: caregiver
    text: No, just the ibuprofen when he needs it.
  - speaker: clinician
    text: Alright. Vitals today, he weighs 20 kilograms, that's 44 pounds. Temperature is 101.9, heart rate 112. Mateo, can you open really big and say ah? Great job.
  - speaker: clinician
    text: Okay, his tonsils are swollen and red, and there's white stuff on them, and some little red spots on the roof of his mouth. The glands in the front of his neck are swollen and tender. Ears look normal, lungs are clear, and I don't see any rash. I'm going to do a quick strep swab, it takes about 10 minutes.
  - speaker: caregiver
    text: Sure. He's gonna hate it, but okay.
  - speaker: clinician
    text: It's quick, I promise. Mateo, count to 3 with me.
  - speaker: caregiver
    text: You did it, buddy.
  - speaker: clinician
    text: Alright, the rapid strep came back positive. So this is strep throat.
  - speaker: caregiver
    text: Okay. So what can he take, since he can't have amoxicillin?
  - speaker: clinician
    text: Since his reaction was hives and not anything severe like swelling or trouble breathing, cephalexin is a safe choice. The dose is 20 milligrams per kilogram, twice a day. At 20 kilograms that's 400 milligrams twice a day. The liquid is 250 milligrams per 5 milliliters, so 8 milliliters twice a day, for 10 days.
  - speaker: caregiver
    text: 8 milliliters, twice a day, 10 days. Got it.
  - speaker: clinician
    text: For the throat pain and fever, ibuprofen is fine. His dose is 200 milligrams, so 10 milliliters of the children's liquid every 6 to 8 hours as needed, with some food.
  - speaker: caregiver
    text: When can he go back to school? He's already missed Monday.
  - speaker: clinician
    text: Once he's had at least 12 hours of the antibiotic and he's fever-free, he can go back. So probably Thursday. I can put a school note in the portal.
  - speaker: caregiver
    text: Great, the portal email is andres dot villanueva at example dot com. And, um, my wife woke up with a scratchy throat today. Should she get the medicine too?
  - speaker: clinician
    text: She'd need to be checked by her own doctor, we don't treat without testing. Same goes for anyone else in the house who gets sick.
  - speaker: caregiver
    text: Okay, makes sense.
  - speaker: clinician
    text: Swap out his toothbrush after a day or two on the medicine. And if he starts drooling, can't swallow his own spit, can't open his mouth all the way, or has trouble breathing, go straight to the emergency room. If he's not better in 2 or 3 days, call us.
  - speaker: caregiver
    text: Okay. And the number you have on file, 555-0118, that's my cell, so call that one.
  - speaker: clinician
    text: Perfect, I'll send it now. And how'd the soccer game go, by the way?
  - speaker: caregiver
    text: They lost 4 to 1, but he scored the 1.
  - speaker: clinician
    text: Nice. Feel better, Mateo.
