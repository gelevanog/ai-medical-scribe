  clinician: {sex: female}
  caregiver: {sex: male}
dialogue:
  - speaker: clinician
    text: "Hi, I'm Dr. Grace Oyelaran. And this must be the patient. Nice shin guards, buddy. Game today?"
  - speaker: caregiver
    text: "Right after this, so he's in a hurry. I'm his dad, Javier."
  - speaker: clinician
    text: "Nice to meet you. Can you confirm his full name and date of birth for me?"
  - speaker: caregiver
    text: "Mateo Herrera, April 21st, 2017. He's 9."
  - speaker: clinician
    text: "Thanks. So what are we looking at today?"
  - speaker: caregiver
    text: "Warts. He's got a couple on his right pointer finger, one on his left thumb, and one on his knee. The finger ones started maybe 5 months ago and they keep multiplying."
  - speaker: clinician
    text: "Have you tried anything for them?"
  - speaker: caregiver
    text: "The drugstore salicylic acid, the 17 percent liquid, every night for about 6 weeks. Didn't really do much."
  - speaker: clinician
    text: "That's pretty common, it can take months. Do they hurt him?"
  - speaker: caregiver
    text: "No, not really. He picks at them, though. And bites his nails."
  - speaker: clinician
    text: "Have they bled or gotten infected?"
  - speaker: caregiver
    text: "No."
  - speaker: clinician
    text: "Is he generally healthy? Any problems with his immune system or a lot of infections?"
  - speaker: caregiver
    text: "No, he's healthy. No medicines, no allergies. Oh, and his sister Lucia has one on the bottom of her foot, if that matters. She's not here today."
  - speaker: clinician
    text: "Good to know, they do spread in families. Okay, Mateo, let me see your hands. On the right index finger there are two rough, skin-colored bumps, 5 millimeters and 3 millimeters, with tiny black dots in them. On the left thumb there's a 6 millimeter one right next to the nail fold. And on the right knee, a 4 millimeter one. These are all common warts. No redness or signs of infection around them."
  - speaker: caregiver
    text: "Can you also look at his arms? He has these little rough bumps on the backs of his upper arms, like sandpaper."
  - speaker: clinician
    text: "Sure. Yes, on the backs of both upper arms there are lots of tiny, pinpoint, rough bumps around the hair follicles, skin-colored to pink. That's keratosis pilaris. It's really common, it's harmless, and it often gets better as kids get older."
  - speaker: caregiver
    text: "Oh good. Is there anything for it?"
  - speaker: clinician
    text: "A urea 10 percent cream once a day after the bath helps smooth it out, it's over the counter. Use a gentle soap and don't scrub hard. Now for the warts, I'd like to freeze them today with liquid nitrogen. It stings for a few seconds. Is that okay, Mateo?"
  - speaker: caregiver
    text: "He's nodding. Go for it."
  - speaker: clinician
    text: "Alright, I'm doing all 4 warts, two freeze-thaw cycles each. Here comes the cold. Great job, you didn't even flinch. Done."
  - speaker: caregiver
    text: "What should we expect now?"
  - speaker: clinician
    text: "They may get red, form a blister, or turn dark over the next few days, that's normal. Children's acetaminophen per the package directions if they're sore. Once the blisters heal, in about a week, restart the salicylic acid at night. Soak first, file the dead skin with an emery board that only he uses, then cover with duct tape."
  - speaker: caregiver
    text: "Duct tape, really?"
  - speaker: clinician
    text: "Really, it helps keep the medicine on. And try to keep him from picking and biting, that's how they spread. If one gets very red, swollen, or has pus, give us a call."
  - speaker: caregiver
    text: "Got it. Does he need to stay home from school?"
  - speaker: clinician
    text: "No, he can go to school and play sports. Where does he go?"
  - speaker: caregiver
    text: "Maple Grove Elementary, 4th grade."
  - speaker: clinician
    text: "Nice. Warts usually take 2 to 4 freezing sessions, so let's bring him back in 3 to 4 weeks for another round. What's the best number for you?"
  - speaker: caregiver
    text: "My cell, 555-0191."
  - speaker: clinician
    text: "Perfect. Good luck at the game, Mateo."
  - speaker: caregiver
    text: "Thanks, Dr. Oyelaran. Say thank you, Mateo. Okay, he said it."
