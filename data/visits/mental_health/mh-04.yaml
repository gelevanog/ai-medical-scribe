dialogue:
  - speaker: clinician
    text: Hello, Hana, good to see you. Let me just confirm, full name and date of birth?
  - speaker: patient
    text: Hana Kobayashi, July 3rd, 1997.
  - speaker: clinician
    text: Thank you. Last time you mentioned you were thinking about getting a dog. Did it happen?
  - speaker: patient
    text: It did! A little shiba puppy. She's chewed two pairs of my shoes already.
  - speaker: clinician
    text: That's the price of admission. So, how has your mood been since July?
  - speaker: patient
    text: Honestly, really steady. On my mood chart app most days are a 5 or a 6. No big lows, no highs.
  - speaker: clinician
    text: No stretches of feeling revved up, needing less sleep, spending more than usual?
  - speaker: patient
    text: No. The last time that happened was two years ago, before we found the right dose.
  - speaker: clinician
    text: And any low periods, losing interest in things, staying in bed?
  - speaker: patient
    text: No, not since last winter, and that was mild.
  - speaker: clinician
    text: How are you sleeping?
  - speaker: patient
    text: About 7 hours, pretty regular. I keep the same bedtime, like you told me.
  - speaker: clinician
    text: Good. You're on lamotrigine 200 milligrams once a day, correct?
  - speaker: patient
    text: Yes. Well, wait, is it 150? No, no, it's 200. The 150 was before the last increase.
  - speaker: clinician
    text: Right, 200. Any missed doses?
  - speaker: patient
    text: Maybe once a month I forget, then I just take it the next day as usual.
  - speaker: clinician
    text: That's fine. Any rash, mouth sores, or blisters anywhere?
  - speaker: patient
    text: No, nothing like that.
  - speaker: clinician
    text: Anything else you're taking?
  - speaker: patient
    text: Just a multivitamin every morning. Oh, and that's actually what I wanted to ask about. My gynecologist, Dr. Alvarez, wants to start me on birth control pills next month. The combination one, norgestimate and ethinyl estradiol.
  - speaker: clinician
    text: I'm glad you asked, that's important. The estrogen in combination pills can lower lamotrigine levels in your blood, sometimes by about half. So the dose that works now could stop being enough.
  - speaker: patient
    text: Oh. I didn't know that.
  - speaker: clinician
    text: Most people don't. Before we talk plans, any thoughts of suicide or of hurting yourself?
  - speaker: patient
    text: No, none. I still have my safety plan and 988 saved in my phone.
  - speaker: clinician
    text: Good. And I looked at your lab work from your primary care doctor in August. Your liver and kidney tests were all normal. Your blood pressure today is 112 over 70, and your weight is 131, same as last time. You're bright and relaxed today, mood euthymic, speech is normal, not pressured, and your thoughts are organized.
  - speaker: patient
    text: My brother takes lamotrigine for his seizures, actually. He never mentioned this.
  - speaker: clinician
    text: It applies to anyone on it. So, to sum up, your bipolar II disorder is stable on lamotrigine 200 milligrams a day, and we'll keep that dose for now. Here's the plan for the pill. I'd like a baseline lamotrigine level this week, drawn in the morning before your dose, at our lab at 2200 Kessler Boulevard. Then once you start the pill, we'll recheck the level 2 to 3 weeks later, and I'll probably need to increase your dose.
  - speaker: patient
    text: Okay. And if I didn't want to deal with that?
  - speaker: clinician
    text: A progestin-only option or an IUD wouldn't really affect it. That's worth raising with Dr. Alvarez. Either way is fine with me, just keep me in the loop.
  - speaker: patient
    text: I'll talk to her.
  - speaker: clinician
    text: Two safety reminders. If you ever get a rash, especially with fever or mouth sores, stop the lamotrigine and call us or go to the emergency room. And if you miss 5 days or more in a row, don't restart at 200, call us, because we'd need to build back up slowly.
  - speaker: patient
    text: Got it.
  - speaker: clinician
    text: Keep the multivitamin. I'll see you in 3 months, unless the level or the pill changes things sooner. Is 317-555-0172 still the best number for the lab results?
  - speaker: patient
    text: Yep, same number. Thanks, Dr. Petrenko.
