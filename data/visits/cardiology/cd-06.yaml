dialogue:
  - speaker: clinician
    text: Hi there, I'm Dr. Viktor Petrov. Before we get going, can you tell me your full name and date of birth?
  - speaker: patient
    text: Rodrigo Esquivel. January 30th, 1982.
  - speaker: clinician
    text: Thanks, Rodrigo. And is your address still the one on Kellogg Avenue?
  - speaker: patient
    text: No, we moved in July. It's 905 Magnolia Terrace now.
  - speaker: clinician
    text: Got it, I'll update that. So Dr. Lindqvist sent you to us about your blood pressure. What's the story?
  - speaker: patient
    text: So at my physical in July it was high, like 156 over 98. She had me check it at home, and it's been running in the 150s over 90s pretty much every day for 2 months.
  - speaker: clinician
    text: And she started a medicine?
  - speaker: patient
    text: Yeah, amlodipine, 5 milligrams once a day. About 6 weeks ago. It came down a little, but my readings are still like 145 over 92.
  - speaker: clinician
    text: Any headaches, vision changes, or chest pain?
  - speaker: patient
    text: No headaches. Vision's fine. No chest pain.
  - speaker: clinician
    text: Shortness of breath, or swelling in your legs?
  - speaker: patient
    text: No, neither.
  - speaker: clinician
    text: Dr. Lindqvist wrote that you're worried because of your family. Tell me about that.
  - speaker: patient
    text: Yeah, that's honestly why I'm here. My dad had a heart attack at 51, and he passed away from a second one at 58. And my mom had a stroke when she was 70. So I'm kind of freaking out about this.
  - speaker: clinician
    text: I'm sorry about your dad. That's a real reason to take this seriously, and we will. Have you ever had any heart problems yourself, any chest pain or a heart test?
  - speaker: patient
    text: No, nothing. Never had any heart issue. Just the blood pressure.
  - speaker: clinician
    text: Okay. Do you snore?
  - speaker: patient
    text: My wife Daniela says I snore like a chainsaw. She says sometimes I stop breathing and then gasp. I'm tired most days, too.
  - speaker: clinician
    text: That's important, I'll come back to it. Any medicines over the counter? Decongestants, pain relievers?
  - speaker: patient
    text: I take pseudoephedrine most mornings for my sinuses. 30 milligrams, maybe 2 tablets.
  - speaker: clinician
    text: Alcohol, smoking?
  - speaker: patient
    text: 3 or 4 beers on the weekend. I've never smoked. I'm a project manager at Brightwater Construction, so I eat a lot of fast food on the road, if I'm being honest.
  - speaker: clinician
    text: Thanks for being straight with me. Let me check you. Your blood pressure is 148 over 94 in the right arm, 144 over 90 in the left. I repeated it after 5 minutes and got 146 over 92. Pulse 80. Weight is 228 pounds, which puts your BMI at 31.4. No bruits in your neck or belly. Heart is regular, no murmurs. Lungs are clear. No leg swelling, and the pulses in your groin and feet are normal.
  - speaker: patient
    text: Okay.
  - speaker: clinician
    text: I also looked at the labs and ECG Dr. Lindqvist sent. Kidney function is normal, creatinine 1.0, potassium 4.1, and your A1c is 5.6, so no diabetes. The ECG from August shows sinus rhythm with some voltage that suggests the heart muscle may be a little thick from the pressure.
  - speaker: patient
    text: Thick? Is that bad?
  - speaker: clinician
    text: It's a sign the blood pressure has been working the heart harder, and it's very treatable. So my thinking is this. You have high blood pressure that isn't controlled yet. To be clear, you haven't had a heart attack or a stroke, those were your parents. But your family history does raise your risk, so we want to get your numbers down and look at the whole picture.
  - speaker: patient
    text: Okay, that helps.
  - speaker: clinician
    text: First, I'm increasing the amlodipine to 10 milligrams once a day. Second, please stop the pseudoephedrine, it pushes the blood pressure up. Use a fluticasone nasal spray instead, 2 sprays in each nostril once a day.
  - speaker: patient
    text: I didn't know that about the decongestant.
  - speaker: clinician
    text: Most people don't. Third, the snoring and stopping breathing sound like sleep apnea, which is a common cause of hard to control blood pressure. I'm ordering a home sleep study. I also want an echocardiogram to look at the heart muscle, and a fasting lipid panel and a urine test for protein.
  - speaker: patient
    text: Okay.
  - speaker: clinician
    text: On the lifestyle side, try to keep salt under 2000 milligrams a day, and cut back to no more than 1 or 2 beers at a time. Keep checking your blood pressure at home twice a day and bring the log and your cuff next time.
  - speaker: patient
    text: Will do. Should I worry about chest pain, like my dad?
  - speaker: clinician
    text: If you ever get chest pain, sudden weakness, or trouble speaking, call 911 right away. Otherwise I'll see you back in 4 weeks to go over the tests and your home numbers.
  - speaker: patient
    text: Sounds good. Thanks, Doctor.
