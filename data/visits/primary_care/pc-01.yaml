  clinician: {sex: female}
  patient: {sex: male}
dialogue:
  - speaker: clinician
    text: Hi, Mr. Washington, come on back. Before we get going, can you confirm your full name and date of birth for me?
  - speaker: patient
    text: Darnell Washington, February 9th, 1968.
  - speaker: clinician
    text: Perfect, thank you. How was the drive in? I heard the parking garage was full again this morning.
  - speaker: patient
    text: Oh, it was. I circled three times and ended up on the street, two blocks down.
  - speaker: clinician
    text: Sorry about that. So this is your blood pressure follow-up. How have things been since we saw you in July?
  - speaker: patient
    text: Pretty good, mostly. I've been checking it at home like you said, and it's still kind of high. Usually like 145, 150 on the top number.
  - speaker: clinician
    text: Okay, that's helpful. And what are you taking for it right now?
  - speaker: patient
    text: The lisinopril, 10 milligrams in the morning. Wait, no. It's 20. You bumped it up last time, remember? I've got the new bottle in the car.
  - speaker: clinician
    text: Right, 20 milligrams once a day. Are you taking it every day?
  - speaker: patient
    text: Every day. I keep it next to the coffee maker so I don't forget.
  - speaker: clinician
    text: Good trick. And you're still on the atorvastatin for your cholesterol?
  - speaker: patient
    text: Yeah, 40 milligrams at night. That one I never miss.
  - speaker: clinician
    text: Great. Any headaches, chest pain, or trouble catching your breath?
  - speaker: patient
    text: No, none of that.
  - speaker: clinician
    text: Any dizziness when you stand up, or swelling in your ankles?
  - speaker: patient
    text: Nope.
  - speaker: clinician
    text: Any cough since you've been on the lisinopril? Some people get a dry, tickly cough with it.
  - speaker: patient
    text: Nah, no cough.
  - speaker: clinician
    text: How about salt? Last time you said you eat out a lot for lunch.
  - speaker: patient
    text: Um, yeah. Still work lunches. Lots of deli sandwiches and chips. I know, I know.
  - speaker: clinician
    text: And alcohol?
  - speaker: patient
    text: A couple beers on the weekend, that's about it.
  - speaker: clinician
    text: Okay. And you mentioned your dad before, right?
  - speaker: patient
    text: Yeah, my father had a stroke at 62. That's kind of why my wife Lorraine stays on me about all this.
  - speaker: clinician
    text: That makes sense, she's looking out for you. Alright, your blood pressure today is 152 over 94, and when I rechecked it after you sat quietly for five minutes, it was 148 over 92. Pulse is 72. Weight is 214 pounds, that's up 3 pounds from July.
  - speaker: patient
    text: Yeah, that's the Halloween candy starting early, I guess.
  - speaker: clinician
    text: Let me take a listen. Heart sounds regular, no murmurs. Lungs are clear. And no swelling in your legs.
  - speaker: clinician
    text: I also have your labs from last week. Your potassium was 4.4 and your kidney function was normal, creatinine 0.9. And your LDL cholesterol was 88.
  - speaker: patient
    text: Is that good?
  - speaker: clinician
    text: The cholesterol is right where we want it. And the kidneys and potassium look fine, which means we have room to go up on the lisinopril.
  - speaker: patient
    text: Okay.
  - speaker: clinician
    text: So here's what I'm thinking. Your blood pressure is still above our goal of under 130 over 80, even on the 20 milligrams. I'd like to increase the lisinopril to 40 milligrams once a day. Until you run out, you can take two of your 20s together in the morning.
  - speaker: patient
    text: Two of the 20s. Got it.
  - speaker: clinician
    text: Keep the atorvastatin the same, 40 milligrams at night. I'd also like you to cut back on salt, aim for less than 2000 milligrams a day. The deli meat and chips are big ones.
  - speaker: patient
    text: I can try packing lunch. Lorraine will be thrilled.
  - speaker: clinician
    text: That would help a lot. Since we're raising the dose, I want a repeat potassium and kidney check in about 2 weeks. You can go to our lab on Brookfield Avenue, no appointment needed.
  - speaker: patient
    text: I'm off on the 19th. Does that work?
  - speaker: clinician
    text: The 19th is perfect. Keep checking at home and bring your log next time. If you get readings over 180 on the top, or a severe headache, chest pain, or weakness on one side, call us or go to the emergency room.
  - speaker: patient
    text: Will do.
  - speaker: clinician
    text: And I'll see you back in 6 weeks. Is your cell still 555-0163?
  - speaker: patient
    text: Yep, same number.
  - speaker: clinician
    text: Great. Any other questions for me?
  - speaker: patient
    text: No, I think that's it. Thanks, doc.
  - speaker: clinician
    text: Take care, Darnell. Good luck with the parking on the way out.
