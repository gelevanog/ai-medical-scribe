dialogue:
  - speaker: clinician
    text: Good morning. I'm Dr. Siobhan Byrne, we met in the hospital back in February. Can you confirm your full name and date of birth for me?
  - speaker: patient
    text: Khalid Mansour, September 8th, 1967.
  - speaker: clinician
    text: Thanks, Mr. Mansour. The front desk mentioned you had a new insurance card?
  - speaker: patient
    text: Yeah, we switched plans. The member ID is K as in kilo 7 3 0 9 2 5 8.
  - speaker: clinician
    text: Got it, I'll make sure they update it. So it's been about 8 months since your stent on February 11th. How are you doing overall?
  - speaker: patient
    text: Heart-wise, good. No chest pain at all since the stent. I finished cardiac rehab in June, and I'm walking 30 minutes most days.
  - speaker: clinician
    text: That's excellent. Any shortness of breath with the walking?
  - speaker: patient
    text: No, I'm fine. The kids at Roosevelt High School keep me moving too, I teach chemistry there.
  - speaker: clinician
    text: Ha, that'll do it. Your portal message said you had a problem with the atorvastatin?
  - speaker: patient
    text: Yeah. So my thighs and calves were aching, both legs, like I'd run a marathon. It started maybe 2 months after the hospital. I put up with it, but about 3 weeks ago I just stopped taking it. I'm sorry, I know I should have called first.
  - speaker: clinician
    text: No need to apologize, I'm glad you're telling me. What dose were you taking?
  - speaker: patient
    text: 40 milligrams. No, wait, it's the big one. 80 milligrams.
  - speaker: clinician
    text: Right, 80 is what we started in the hospital. And since you stopped it, how are the legs?
  - speaker: patient
    text: Much better. Maybe 90 percent gone.
  - speaker: clinician
    text: Any muscle weakness, trouble getting up from a chair, or dark, cola colored urine?
  - speaker: patient
    text: No, nothing like that.
  - speaker: clinician
    text: Good. And the other medicines, the aspirin, clopidogrel and metoprolol, you're still taking those?
  - speaker: patient
    text: Aspirin 81 once a day, clopidogrel 75 once a day, and the metoprolol, 25 milligrams once a day. I haven't missed any of those.
  - speaker: clinician
    text: Great. Any bleeding or bruising on the two blood thinners?
  - speaker: patient
    text: Some small bruises on my arms. Nothing serious.
  - speaker: clinician
    text: That's common on those two. And you're still allergic to sulfa drugs?
  - speaker: patient
    text: Yes, I get a rash all over.
  - speaker: clinician
    text: Okay. Your blood pressure today is 124 over 76, pulse 62. Heart has a regular rhythm, no murmur. Lungs are clear. The spot on your right wrist where we put the catheter in is well healed. No tenderness in your thigh or calf muscles, and your leg strength is normal.
  - speaker: patient
    text: Good.
  - speaker: clinician
    text: Your labs from last week, so after about 2 weeks off the statin, show an LDL of 118. For someone with a stent, we want the LDL under 55, so that's well above goal. Your CK, the muscle enzyme, was normal at 145, and your liver tests were normal.
  - speaker: patient
    text: So what now? I really don't want those aches back.
  - speaker: clinician
    text: Totally understandable. Muscle aches on statins are common, and a lot of people do fine on a different statin at a lower dose. So I'd like to start rosuvastatin, 5 milligrams once a day. And I'm adding ezetimibe, 10 milligrams once a day. It blocks cholesterol absorption in the gut, and it doesn't cause muscle aches.
  - speaker: patient
    text: Two new pills, huh?
  - speaker: clinician
    text: Yes, but together they should get you close to goal. If the aches come back, stop the rosuvastatin and send me a message, but keep taking the ezetimibe.
  - speaker: patient
    text: Okay, that I can do.
  - speaker: clinician
    text: We'll recheck a lipid panel and liver tests in 8 weeks. If your LDL is still above 55 after that, there are injectable cholesterol medicines we could talk about, but let's not get ahead of ourselves.
  - speaker: patient
    text: Fair enough.
  - speaker: clinician
    text: Keep taking the aspirin and the clopidogrel through February, that's 12 months after the stent, and please don't stop the clopidogrel without talking to us first. Keep the metoprolol the same, and keep up the walking.
  - speaker: patient
    text: Will do.
  - speaker: clinician
    text: So to sum up, you have coronary artery disease with a stent, which is stable, and high LDL cholesterol not at goal because you couldn't tolerate the atorvastatin. I'll see you back in 3 months.
  - speaker: patient
    text: Thanks, Dr. Byrne.
